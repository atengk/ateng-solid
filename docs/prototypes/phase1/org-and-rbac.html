<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ateng-solid 第一阶段组织架构与 RBAC（含 @DataScope 与 Fesod Excel 批注）原型</title>
  <style>
    /* ============================================================
     * Precision Slate & Cobalt Design Tokens (design-system.md)
     * ============================================================ */
    :root {
      --solid-bg-canvas: #F6F7F9;
      --solid-bg-surface: #FFFFFF;
      --solid-bg-elevated: #FFFFFF;
      --solid-bg-subtle: #EEF1F5;

      --solid-text-primary: #0F172A;
      --solid-text-regular: #334155;
      --solid-text-secondary: #475569;
      --solid-text-muted: #64748B;

      --solid-primary: #1D4ED8;
      --solid-primary-hover: #1E40AF;
      --solid-primary-soft: #EFF6FF;
      --solid-primary-border: #BFDBFE;

      --solid-border: rgba(15, 23, 42, 0.10);
      --solid-border-light: rgba(15, 23, 42, 0.06);

      --solid-success: #047857;
      --solid-success-soft: #ECFDF5;
      --solid-success-border: #A7F3D0;
      --solid-warning: #B45309;
      --solid-warning-soft: #FFFBEB;
      --solid-warning-border: #FDE68A;
      --solid-danger: #DC2626;
      --solid-danger-soft: #FEF2F2;
      --solid-danger-border: #FECACA;
      --solid-info: #475569;
      --solid-info-soft: #F1F5F9;

      --solid-radius-sm: 4px;
      --solid-radius-md: 6px;
      --solid-radius-lg: 8px;
      --solid-radius-pill: 9999px;

      --solid-shadow-popover: 0 12px 28px -6px rgba(15, 23, 42, 0.14), 0 4px 10px -2px rgba(15, 23, 42, 0.06);
      --solid-focus-ring: 0 0 0 2px var(--solid-bg-surface), 0 0 0 4px var(--solid-primary);

      --solid-font-sans: 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --solid-font-mono: 'JetBrains Mono', 'Cascadia Mono', ui-monospace, SFMono-Regular, monospace;
    }

    html.dark {
      --solid-bg-canvas: #0B0F17;
      --solid-bg-surface: #111827;
      --solid-bg-elevated: #182234;
      --solid-bg-subtle: #1E293B;

      --solid-text-primary: #F8FAFC;
      --solid-text-regular: #CBD5E1;
      --solid-text-secondary: #94A3B8;
      --solid-text-muted: #64748B;

      --solid-primary: #3B82F6;
      --solid-primary-hover: #60A5FA;
      --solid-primary-soft: rgba(59, 130, 246, 0.15);
      --solid-primary-border: rgba(59, 130, 246, 0.35);

      --solid-border: rgba(226, 232, 240, 0.12);
      --solid-border-light: rgba(226, 232, 240, 0.07);

      --solid-success: #10B981;
      --solid-success-soft: rgba(16, 185, 129, 0.14);
      --solid-success-border: rgba(16, 185, 129, 0.30);
      --solid-warning: #F59E0B;
      --solid-warning-soft: rgba(245, 158, 11, 0.14);
      --solid-warning-border: rgba(245, 158, 11, 0.32);
      --solid-danger: #F87171;
      --solid-danger-soft: rgba(248, 113, 113, 0.14);
      --solid-danger-border: rgba(248, 113, 113, 0.32);
      --solid-info: #94A3B8;
      --solid-info-soft: #1E293B;

      --solid-shadow-popover: 0 16px 36px -8px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(226, 232, 240, 0.14);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: var(--solid-font-sans); font-size: 14px; line-height: 1.5;
      background: var(--solid-bg-canvas); color: var(--solid-text-primary);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font-family: inherit; }
    :focus-visible { outline: none; box-shadow: var(--solid-focus-ring); }
    .mono { font-family: var(--solid-font-mono); font-variant-numeric: tabular-nums; }
    .tabular { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }

    /* Shell */
    .app-shell { display: flex; height: 100vh; width: 100vw; overflow: hidden; background: var(--solid-bg-canvas); }
    .sidebar {
      width: 228px; flex-shrink: 0; background: var(--solid-bg-surface);
      border-right: 1px solid var(--solid-border); display: flex; flex-direction: column; transition: width 0.2s ease;
    }
    .sidebar.collapsed { width: 60px; }
    .brand-bar { height: 48px; padding: 0 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--solid-border-light); flex-shrink: 0; overflow: hidden; }
    .brand-logo { width: 28px; height: 28px; border-radius: var(--solid-radius-md); background: var(--solid-primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
    .brand-name { font-weight: 600; font-size: 14px; white-space: nowrap; }
    .brand-sub { font-size: 11px; color: var(--solid-text-secondary); margin-left: 2px; }
    .sidebar.collapsed .brand-text, .sidebar.collapsed .menu-group-label, .sidebar.collapsed .menu-item-label { display: none; }
    .menu-scroll { flex: 1; overflow-y: auto; padding: 10px 8px; }
    .menu-group-label { font-size: 12px; font-weight: 600; color: var(--solid-text-muted); padding: 8px 10px 4px; }
    .menu-item {
      width: 100%; border: none; background: transparent; display: flex; align-items: center; gap: 9px;
      padding: 8px 10px; border-radius: var(--solid-radius-md); color: var(--solid-text-regular);
      font-size: 13px; cursor: pointer; text-align: left; margin-bottom: 2px;
    }
    .menu-item:hover { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }
    .menu-item.active { background: var(--solid-primary-soft); color: var(--solid-primary); font-weight: 600; }
    .sidebar.collapsed .menu-item { justify-content: center; padding: 9px; }

    .main-column { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 48px; background: var(--solid-bg-surface); border-bottom: 1px solid var(--solid-border); padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }
    .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--solid-text-secondary); white-space: nowrap; }
    .breadcrumb .current { color: var(--solid-text-primary); font-weight: 600; }

    .tenant-pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--solid-radius-md); border: 1px solid var(--solid-border); background: var(--solid-bg-subtle); color: var(--solid-text-primary); font-size: 12px; cursor: pointer; }
    .tenant-pill.switched { background: var(--solid-warning-soft); border-color: var(--solid-warning-border); color: var(--solid-warning); font-weight: 600; }
    .tenant-pill.readonly { cursor: default; }
    .user-trigger { display: inline-flex; align-items: center; gap: 8px; padding: 3px 8px 3px 4px; border-radius: var(--solid-radius-md); border: 1px solid transparent; background: transparent; color: var(--solid-text-primary); cursor: pointer; font-size: 13px; }
    .avatar-circle { width: 26px; height: 26px; border-radius: var(--solid-radius-pill); background: var(--solid-primary-soft); color: var(--solid-primary); border: 1px solid var(--solid-primary-border); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }

    .tabs-bar { height: 36px; background: var(--solid-bg-surface); border-bottom: 1px solid var(--solid-border); padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; }
    .tabs-list { display: flex; align-items: center; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
    .tab-chip { height: 26px; padding: 0 10px; border-radius: var(--solid-radius-sm); border: 1px solid transparent; background: transparent; color: var(--solid-text-secondary); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .tab-chip:hover { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }
    .tab-chip.active { background: var(--solid-primary-soft); border-color: var(--solid-primary-border); color: var(--solid-primary); font-weight: 600; }
    .tab-close { width: 14px; height: 14px; border-radius: 3px; border: none; background: transparent; color: inherit; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; padding: 0; opacity: 0.7; }

    .tenant-banner { background: var(--solid-warning-soft); border-bottom: 1px solid var(--solid-warning-border); color: var(--solid-warning); padding: 6px 16px; font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }
    .workspace { flex: 1; overflow: auto; padding: 14px 16px 84px; display: flex; flex-direction: column; gap: 12px; }

    /* Shared UI Controls */
    .card { background: var(--solid-bg-surface); border: 1px solid var(--solid-border); border-radius: var(--solid-radius-lg); }
    .btn { height: 32px; padding: 0 12px; border-radius: var(--solid-radius-md); border: 1px solid var(--solid-border); background: var(--solid-bg-surface); color: var(--solid-text-regular); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; white-space: nowrap; }
    .btn:hover:not(:disabled) { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-sm { height: 26px; padding: 0 9px; font-size: 12px; }
    .btn-primary { background: var(--solid-primary); border-color: var(--solid-primary); color: #FFFFFF; }
    .btn-primary:hover:not(:disabled) { background: var(--solid-primary-hover); border-color: var(--solid-primary-hover); color: #FFFFFF; }
    .btn-link { border: none; background: transparent; color: var(--solid-primary); padding: 2px 6px; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: var(--solid-radius-sm); }
    .btn-link:hover:not(:disabled) { background: var(--solid-primary-soft); }
    .btn-link.danger { color: var(--solid-danger); }
    .btn-link.danger:hover:not(:disabled) { background: var(--solid-danger-soft); }
    .btn-link:disabled { color: var(--solid-text-muted); cursor: not-allowed; opacity: 0.55; }
    .icon-btn { width: 32px; height: 32px; border-radius: var(--solid-radius-md); border: 1px solid transparent; background: transparent; color: var(--solid-text-regular); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .icon-btn:hover { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }

    .input, .select, .textarea {
      height: 32px; padding: 0 10px; border-radius: var(--solid-radius-md);
      border: 1px solid var(--solid-border); background: var(--solid-bg-surface);
      color: var(--solid-text-primary); font-size: 13px; width: 100%;
    }
    .textarea { height: auto; min-height: 64px; padding: 8px 10px; resize: vertical; }
    .input.is-error, .select.is-error { border-color: var(--solid-danger); }
    .input:disabled, .select:disabled { background: var(--solid-bg-subtle); color: var(--solid-text-muted); cursor: not-allowed; }
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    .field-label { font-size: 12px; font-weight: 500; color: var(--solid-text-secondary); display: flex; align-items: center; justify-content: space-between; }
    .field-error { font-size: 12px; color: var(--solid-danger); }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: var(--solid-radius-sm); font-size: 12px; font-weight: 500; white-space: nowrap; }
    .tag-primary { background: var(--solid-primary-soft); color: var(--solid-primary); }
    .tag-success { background: var(--solid-success-soft); color: var(--solid-success); }
    .tag-warning { background: var(--solid-warning-soft); color: var(--solid-warning); }
    .tag-danger { background: var(--solid-danger-soft); color: var(--solid-danger); }
    .tag-info { background: var(--solid-info-soft); color: var(--solid-info); }

    .switch { width: 34px; height: 18px; border-radius: var(--solid-radius-pill); background: var(--solid-text-muted); border: none; position: relative; cursor: pointer; vertical-align: middle; }
    .switch.on { background: var(--solid-primary); }
    .switch:disabled { opacity: 0.45; cursor: not-allowed; }
    .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
    .switch.on::after { transform: translateX(16px); }

    .alert-box { padding: 9px 12px; border-radius: var(--solid-radius-md); border: 1px solid var(--solid-border); font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .alert-warning { background: var(--solid-warning-soft); border-color: var(--solid-warning-border); color: var(--solid-warning); }
    .alert-danger { background: var(--solid-danger-soft); border-color: var(--solid-danger-border); color: var(--solid-danger); }
    .alert-info { background: var(--solid-primary-soft); border-color: var(--solid-primary-border); color: var(--solid-primary); }

    /* Query & Table */
    .split-wrap { display: flex; gap: 12px; min-height: 0; flex: 1; }
    .dept-panel { width: 230px; flex-shrink: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .dept-node { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-radius: var(--solid-radius-sm); font-size: 13px; color: var(--solid-text-regular); cursor: pointer; }
    .dept-node:hover { background: var(--solid-bg-subtle); }
    .dept-node.active { background: var(--solid-primary-soft); color: var(--solid-primary); font-weight: 600; }
    .table-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }

    .query-card { padding: 12px 14px; }
    .query-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 10px 14px; align-items: end; }
    .query-actions { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
    .table-card { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
    .table-card.fullscreen { position: fixed; inset: 12px; z-index: 900; box-shadow: var(--solid-shadow-popover); }
    .table-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .table-scroll { overflow: auto; border: 1px solid var(--solid-border); border-radius: var(--solid-radius-md); }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.data-table th { background: var(--solid-bg-subtle); color: var(--solid-text-secondary); font-weight: 600; text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--solid-border); white-space: nowrap; }
    table.data-table td { padding: 9px 12px; border-bottom: 1px solid var(--solid-border-light); color: var(--solid-text-regular); white-space: nowrap; }
    table.data-table.density-large th, table.data-table.density-large td { padding: 12px 12px; }
    table.data-table.density-small th, table.data-table.density-small td { padding: 5px 10px; font-size: 12px; }
    table.data-table.striped tbody tr:nth-child(even) { background: var(--solid-bg-canvas); }
    table.data-table tbody tr:hover { background: var(--solid-primary-soft); }
    .col-sticky-right { position: sticky; right: 0; background: var(--solid-bg-surface); border-left: 1px solid var(--solid-border-light); }
    th.col-sticky-right { background: var(--solid-bg-subtle); }
    .pagination-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--solid-text-secondary); padding-top: 2px; }

    /* Tree Controls inside Drawers / Dialogs */
    .tree-box { border: 1px solid var(--solid-border); border-radius: var(--solid-radius-md); padding: 10px 12px; background: var(--solid-bg-canvas); max-height: 260px; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
    .tree-row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: var(--solid-radius-sm); font-size: 13px; }
    .tree-row:hover { background: var(--solid-bg-subtle); }
    .tree-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; font-size: 12px; }
    .segmented { display: inline-flex; border: 1px solid var(--solid-border); border-radius: var(--solid-radius-md); overflow: hidden; }
    .segmented button { border: none; background: var(--solid-bg-surface); color: var(--solid-text-regular); padding: 6px 14px; font-size: 13px; cursor: pointer; border-right: 1px solid var(--solid-border); }
    .segmented button:last-child { border-right: none; }
    .segmented button.active { background: var(--solid-primary); color: #fff; font-weight: 600; }

    .icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 8px; border: 1px solid var(--solid-border); border-radius: var(--solid-radius-md); background: var(--solid-bg-canvas); }
    .icon-cell { height: 32px; border: 1px solid var(--solid-border-light); border-radius: var(--solid-radius-sm); background: var(--solid-bg-surface); color: var(--solid-text-regular); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .icon-cell.active { border-color: var(--solid-primary); background: var(--solid-primary-soft); color: var(--solid-primary); }

    .multi-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px solid var(--solid-border); border-radius: var(--solid-radius-md); background: var(--solid-bg-canvas); }
    .chip-check { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: var(--solid-radius-sm); border: 1px solid var(--solid-border); background: var(--solid-bg-surface); font-size: 12px; cursor: pointer; }
    .chip-check.disabled { opacity: 0.45; cursor: not-allowed; }

    /* Modals & Drawers */
    .popover-menu { position: fixed; z-index: 1200; min-width: 170px; background: var(--solid-bg-elevated); border: 1px solid var(--solid-border); border-radius: var(--solid-radius-md); box-shadow: var(--solid-shadow-popover); padding: 5px; display: none; flex-direction: column; gap: 2px; }
    .popover-menu.open { display: flex; }
    .popover-item { border: none; background: transparent; padding: 7px 10px; border-radius: var(--solid-radius-sm); font-size: 13px; color: var(--solid-text-regular); text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .popover-item:hover:not(:disabled) { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }
    .popover-item:disabled { opacity: 0.4; cursor: not-allowed; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .drawer-backdrop { justify-content: flex-end; }
    .drawer-panel { width: 520px; max-width: 100vw; height: 100vh; background: var(--solid-bg-surface); border-left: 1px solid var(--solid-border); display: flex; flex-direction: column; box-shadow: var(--solid-shadow-popover); }
    .drawer-panel.size-large { width: 720px; }
    .dialog-panel { width: 520px; max-width: calc(100vw - 32px); max-height: 90vh; background: var(--solid-bg-surface); border: 1px solid var(--solid-border); border-radius: var(--solid-radius-lg); box-shadow: var(--solid-shadow-popover); display: flex; flex-direction: column; }
    .dialog-panel.w-480 { width: 480px; }
    .dialog-panel.w-640 { width: 640px; }
    .dialog-panel.w-720 { width: 720px; }
    .panel-header { padding: 14px 18px; border-bottom: 1px solid var(--solid-border); display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; flex-shrink: 0; }
    .panel-body { padding: 16px 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .panel-footer { padding: 12px 18px; border-top: 1px solid var(--solid-border); display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-shrink: 0; }

    .toast-stack { position: fixed; top: 16px; right: 16px; z-index: 1500; display: flex; flex-direction: column; gap: 8px; max-width: 440px; }
    .toast-item { background: var(--solid-bg-elevated); border: 1px solid var(--solid-border); border-left: 3px solid var(--solid-primary); border-radius: var(--solid-radius-md); box-shadow: var(--solid-shadow-popover); padding: 10px 14px; font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .toast-item.danger { border-left-color: var(--solid-danger); }
    .toast-item.warning { border-left-color: var(--solid-warning); }
    .toast-item.success { border-left-color: var(--solid-success); }

    .sim-bar {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 1400; background: #0F172A; color: #F8FAFC;
      border: 1px solid rgba(255, 255, 255, 0.16); border-radius: var(--solid-radius-pill);
      padding: 6px 12px; display: flex; align-items: center; gap: 6px;
      box-shadow: 0 18px 40px -8px rgba(0, 0, 0, 0.45); font-size: 12px; max-width: calc(100vw - 24px); overflow-x: auto; white-space: nowrap;
    }
    .sim-btn { border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.08); color: #F8FAFC; padding: 3px 9px; border-radius: var(--solid-radius-pill); cursor: pointer; font-size: 12px; }
    .sim-btn:hover { background: rgba(255, 255, 255, 0.16); }
    .sim-btn.on { border-color: #60A5FA; background: rgba(37, 99, 235, 0.45); font-weight: 600; }
    .sim-sep { width: 1px; height: 14px; background: rgba(255, 255, 255, 0.22); flex-shrink: 0; }

    @media (max-width: 1120px) { .query-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dept-panel { width: 190px; } }
    @media (max-width: 768px) {
      .split-wrap { flex-direction: column; } .dept-panel { width: 100%; }
      .query-grid, .form-grid-2 { grid-template-columns: 1fr; }
      .drawer-panel, .drawer-panel.size-large { width: 100vw; }
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell"></div>

  <div id="tenantPopover" class="popover-menu" role="menu"></div>
  <div id="exportPopover" class="popover-menu" role="menu"></div>

    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function maskPhone(p) { return !p || p.length < 7 ? '--' : p.slice(0, 3) + '****' + p.slice(-4); }
    function maskEmail(e) { if (!e || !e.includes('@')) return '--'; const [n, d] = e.split('@'); return (n.length <= 1 ? '*' : n[0] + '***') + '@' + d; }
    function effTenantId() { return !state.tenantEnabled ? '0' : (state.actorType === 'tenant_admin' ? '10002' : state.activeTenantId); }
    function tenantObj(id) { return TENANTS.find(t => t.id === id) || TENANTS[0]; }
    function visibleNavMenus() {
      const eff = effTenantId();
      return NAV_MENUS.filter(m => !(m.platformOnly && (state.actorType !== 'super_admin' || eff !== '0')));
    }
    function deptDescendantIds(tenantId, rootId) {
      const list = DB.depts[tenantId] || [];
      const set = new Set([rootId]);
      let added = true;
      while (added) {
        added = false;
        for (const d of list) {
          if (set.has(d.parentId) && !set.has(d.id)) { set.add(d.id); added = true; }
        }
      }
      return set;
    }
    function flattenTree(list, parentId = '0', depth = 0, out = []) {
      const children = list.filter(x => x.parentId === parentId).sort((a, b) => a.sort - b.sort);
      for (const c of children) {
        out.push({ item: c, depth });
        flattenTree(list, c.id, depth + 1, out);
      }
      return out;
    }
    function menuDescendantIds(rootId) {
      const set = new Set([rootId]);
      let added = true;
      while (added) {
        added = false;
        for (const m of DB.menus) {
          if (set.has(m.parentId) && !set.has(m.id)) { set.add(m.id); added = true; }
        }
      }
      return set;
    }
    function getScopedMenusForRole() {
      const eff = effTenantId();
      if (eff === '0') return DB.menus.filter(m => m.status === 0);
      const t = tenantObj(eff);
      const pkgIds = new Set(PACKAGES[t.packageId] || []);
      return DB.menus.filter(m => m.status === 0 && !m.platformOnly && pkgIds.has(m.id));
    }
    function checkPwdStrength(pwd) {
      const lenOk = pwd.length >= 8 && pwd.length <= 20;
      const noSpace = pwd.length > 0 && !/\s/.test(pwd);
      const cats = [/[A-Z]/.test(pwd), /[a-z]/.test(pwd), /\d/.test(pwd), /[^A-Za-z0-9\s]/.test(pwd)].filter(Boolean).length;
      return { lenOk, noSpace, catsOk: cats >= 3, ok: lenOk && noSpace && cats >= 3 };
    }
    function showToast(type, msg) {
      const stack = document.getElementById('toastStack');
      const div = document.createElement('div');
      div.className = 'toast-item ' + type;
      div.innerHTML = `<span>${esc(msg)}</span><button class="icon-btn" style="width:22px;height:22px;" onclick="this.closest('.toast-item').remove()">✕</button>`;
      stack.appendChild(div);
      setTimeout(() => { if (div.parentNode) div.remove(); }, 4200);
    }
    function openConfirm(title, html, onOk, okText = '确认执行') {

    function saveDeptModal() {
      const { mode, form } = state.modal;
      const eff = effTenantId();
      const list = DB.depts[eff] || [];
      const errors = {};
      const name = form.deptName.trim();
      if (name.length < 2 || name.length > 50) errors.deptName = '部门名称需为 2~50 个字符';
      if (list.some(d => d.parentId === form.parentId && d.deptName === name && d.id !== form.id)) errors.deptName = '同级下已存在相同部门名称 (102002)';
      if (form.phone && !/^1\d{10}$/.test(form.phone.trim())) errors.phone = '请输入 11 位合法手机号';
      if (form.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) errors.email = '请输入合法邮箱';
      if (mode === 'edit') {
        const desc = deptDescendantIds(eff, form.id);
        if (desc.has(form.parentId)) errors.parentId = '上级部门不能选择自身或下级部门 (100001)';
        if (Number(form.status) === 1 && list.some(d => d.parentId === form.id && d.status === 0)) {
          errors.status = '存在未停用的下级部门，禁止停用 (102005)';
        }
      }
      if (Object.keys(errors).length) { state.modal.errors = errors; render(); return; }

      const parent = list.find(d => d.id === form.parentId);
      const newAnc = form.parentId === '0' ? '0' : `${parent.ancestors},${parent.id}`;
      if (mode === 'create') {
        list.push({ ...form, id: String(Date.now()).slice(-5), deptName: name, ancestors: newAnc, sort: Number(form.sort) || 0, status: Number(form.status), createTime: '2026-11-24 18:05:00' });
        showToast('success', `已新增部门 ${name}（ancestors=${newAnc}）`);
      } else {
        const target = list.find(d => d.id === form.id);
        const oldPrefix = `${target.ancestors},${target.id}`;
        const newPrefix = `${newAnc},${target.id}`;
        let updatedCount = 0;
        if (target.ancestors !== newAnc) {
          for (const d of list) {
            if (d.id !== target.id && (d.ancestors === oldPrefix || d.ancestors.startsWith(oldPrefix + ','))) {
              d.ancestors = newPrefix + d.ancestors.slice(oldPrefix.length);
              updatedCount++;
            }
          }
        }
        Object.assign(target, form, { deptName: name, ancestors: newAnc, sort: Number(form.sort) || 0, status: Number(form.status) });
        showToast('success', updatedCount > 0 ? `已保存部门并级联更新 ${updatedCount} 个子孙节点 ancestors` : `已保存部门 ${name}`);
      }
      state.modal = null;

    function openRoleDrawer(id) {
      const eff = effTenantId();
      const r = id ? (DB.roles[eff] || []).find(x => x.id === id) : null;
      if (r?.protected) return;
      const scoped = getScopedMenusForRole();
      const scopedIds = new Set(scoped.map(m => m.id));
      let checkedSet;
      if (!r) {
        checkedSet = new Set();
      } else if (r.menuCheckStrictly) {
        // Restore leaf-only checked keys to prevent auto-checking siblings!
        checkedSet = new Set(r.menuIds.filter(mid => scopedIds.has(mid) && !scoped.some(child => child.parentId === mid)));
      } else {
        checkedSet = new Set(r.menuIds.filter(mid => scopedIds.has(mid)));
      }
      const form = r ? { ...r } : { id: '', roleName: '', roleKey: '', dataScope: 1, sort: 2, status: 0, menuCheckStrictly: true, deptCheckStrictly: false, remark: '' };
      state.modal = { type: 'role', mode: r ? 'edit' : 'create', form, checkedMenuIds: checkedSet, treeExpanded: true, errors: {} };
      render();
    }
    function toggleRoleMenuNode(menuId, checked) {
      const { form, checkedMenuIds } = state.modal;
      const scoped = getScopedMenusForRole();
      if (form.menuCheckStrictly) {
        const desc = (function walk(pid, acc = new Set([pid])) {
          for (const m of scoped) if (m.parentId === pid && !acc.has(m.id)) { acc.add(m.id); walk(m.id, acc); }
          return acc;
        })(menuId);
        desc.forEach(id => checked ? checkedMenuIds.add(id) : checkedMenuIds.delete(id));
      } else {
        checked ? checkedMenuIds.add(menuId) : checkedMenuIds.delete(menuId);
      }
      render();
    }
    function saveRoleDrawer() {
      const { mode, form, checkedMenuIds } = state.modal;
      const eff = effTenantId();
      const list = DB.roles[eff] || [];
      const errors = {};
      const rName = form.roleName.trim();
      const rKey = form.roleKey.trim();
      if (rName.length < 2 || rName.length > 30) errors.roleName = '角色名称须为 2~30 个字符';
      if (!/^[a-zA-Z0-9_-]{2,64}$/.test(rKey)) errors.roleKey = '编码须为 2~64 位字母/数字/下划线/短横线';
      if (rKey === 'super_admin' || rKey === 'admin') errors.roleKey = '禁止使用保留角色编码 super_admin 或 admin (102004)';
      if (list.some(r => r.roleKey === rKey && r.id !== form.id)) errors.roleKey = '当前租户下角色编码已存在 (102002)';
      if (Object.keys(errors).length) { state.modal.errors = errors; render(); return; }

      // Collect checked + ancestor parents when menuCheckStrictly=true
      const scoped = getScopedMenusForRole();
      const finalMenus = new Set(checkedMenuIds);
      if (form.menuCheckStrictly) {
        const byId = Object.fromEntries(scoped.map(m => [m.id, m]));
        for (const id of [...checkedMenuIds]) {
          let cur = byId[id];
          while (cur && cur.parentId !== '0' && byId[cur.parentId]) {
            finalMenus.add(cur.parentId);
            cur = byId[cur.parentId];
          }
        }

      if (mode === 'create') {
        list.push({ ...form, id: 'r_' + Date.now(), roleName: rName, roleKey: rKey, menuIds: [...finalMenus], deptIds: [], protected: false, sort: Number(form.sort) || 0, status: Number(form.status), createTime: '2026-11-24 18:10:00' });

      const un = form.username.trim();

      const ph = form.phone.trim();
      const em = form.email.trim();
      if (mode === 'create') {
        if (!/^[a-zA-Z0-9_]{2,30}$/.test(un)) errors.username = '账号须为 2~30 位字母/数字/下划线';
        if (list.some(u => u.username === un)) errors.username = '登录账号在当前租户已存在 (102002)';
        if (!checkPwdStrength(form.password).ok) errors.password = '初始密码须 8~20 位无空白且至少含 3 类字符';
      }
      if (nn.length < 2 || nn.length > 30) errors.nickname = '用户昵称须为 2~30 个字符';
      if (ph && !/^1[3-9]\d{9}$/.test(ph)) errors.phone = '请输入合法 11 位手机号码';
      if (ph && list.some(u => u.phone === ph && u.id !== form.id)) errors.phone = '手机号在当前租户已被使用 (102002)';
      if (em && (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em) || em.length > 64)) errors.email = '请输入合法邮箱 (<=64)';
      if (em && list.some(u => u.email === em && u.id !== form.id)) errors.email = '邮箱在当前租户已被使用 (102002)';

      const t = tenantObj(eff);
      if (state.tenantEnabled && t.accountCount > 0) {
        const oldUser = mode === 'edit' ? list.find(u => u.id === form.id) : null;
        const activeCount = list.filter(u => u.status === 0).length;
        const willAddActive = (mode === 'create' && Number(form.status) === 0) || (oldUser && oldUser.status === 1 && Number(form.status) === 0);
        if ((willAddActive && activeCount >= t.accountCount) || (mode === 'create' && list.length >= t.accountCount)) {
          errors.quota = `当前租户【${t.name}】用户数已达套餐上限 ${t.accountCount}（102006）`;
        }
      }
      if (Object.keys(errors).length) { state.modal.errors = errors; render(); return; }

      if (mode === 'create') {
        list.push({ ...form, id: String(Date.now()).slice(-6), username: un, nickname: nn, phone: ph, email: em, status: Number(form.status), protected: false, isSelf: false, pwdUpdateTime: null, createTime: '2026-11-24 18:12:00' });
        showToast('success', `已新增用户 ${un}（pwd_update_time=NULL，首登工作台将提醒改密）`);
      } else {
        Object.assign(list.find(x => x.id === form.id), form, { nickname: nn, phone: ph, email: em, status: Number(form.status) });
        showToast('success', `已保存用户 ${un} 并清理权限缓存`);
      }
      state.modal = null; render();
    }

    function renderRolePage() {
      const eff = effTenantId();
      const rows = (DB.roles[eff] || []).filter(r => {
        if (state.roleQuery.roleName.trim() && !r.roleName.includes(state.roleQuery.roleName.trim())) return false;
        if (state.roleQuery.roleKey.trim() && !r.roleKey.includes(state.roleQuery.roleKey.trim())) return false;
        if (state.roleQuery.status !== '' && String(r.status) !== state.roleQuery.status) return false;
        return true;
      });
      const dsLabel = code => (DATA_SCOPES.find(x => x.code === code)?.label || '').split(' ')[0];
      return `
        <section class="card query-card">
          <div class="query-grid">
            <div class="field-group"><label class="field-label">角色名称</label><input id="rqName" class="input" placeholder="输入角色名称" value="${esc(state.roleQuery.roleName)}" oninput="state.roleQuery.roleName=this.value" /></div>
            <div class="field-group"><label class="field-label">角色编码</label><input id="rqKey" class="input mono" placeholder="输入角色编码" value="${esc(state.roleQuery.roleKey)}" oninput="state.roleQuery.roleKey=this.value" /></div>
            <div class="field-group"><label class="field-label">状态</label><select class="select" onchange="state.roleQuery.status=this.value; render();"><option value="" ${state.roleQuery.status===''?'selected':''}>全部</option><option value="0" ${state.roleQuery.status==='0'?'selected':''}>正常</option><option value="1" ${state.roleQuery.status==='1'?'selected':''}>停用</option></select></div>
            <div class="query-actions"><button class="btn btn-primary" type="button" onclick="render()">查询</button><button class="btn" type="button" onclick="state.roleQuery={roleName:'',roleKey:'',status:''}; render();">重置</button></div>

        <section class="card table-card">

              <button class="btn btn-primary" type="button" onclick="openRoleDrawer(null)">+ 新增角色</button>
              <button class="btn" type="button" ${state.selectedRoleIds.size === 0 ? 'disabled' : ''} onclick="deleteRoles([...state.selectedRoleIds])">批量删除 (${state.selectedRoleIds.size})</button>
            </div>
            <div class="toolbar-right"><span style="font-size:12px;color:var(--solid-text-secondary);">保留编码禁止 super_admin / admin；菜单树按当前租户套餐裁剪</span></div>
          </div>
          <div class="table-scroll">
            <table class="data-table">
              <thead><tr><th style="width:36px;"></th><th>角色名称</th><th>角色编码</th><th>@DataScope 数据范围</th><th>排序</th><th>状态</th><th>创建时间</th><th class="col-sticky-right">操作</th></tr></thead>
              <tbody>
                ${rows.map(r => {

                      <td><input type="checkbox" ${locked ? 'disabled title="' + tip + '"' : ''} ${state.selectedRoleIds.has(r.id) ? 'checked' : ''} onchange="this.checked?state.selectedRoleIds.add('${r.id}'):state.selectedRoleIds.delete('${r.id}'); render();" /></td>
                      <td>${esc(r.roleName)}</td>
                      <td class="mono">${esc(r.roleKey)} ${locked ? '<span class="tag tag-primary">平台内置</span>' : ''}</td>
                      <td><span class="tag ${r.dataScope === 2 ? 'tag-warning' : 'tag-info'}">${dsLabel(r.dataScope)}${r.dataScope === 2 ? ' (' + r.deptIds.length + '部门)' : ''}</span></td>
                      <td class="mono">${r.sort}</td>

                        <button class="btn-link" type="button" ${locked ? 'disabled title="' + tip + '"' : ''} onclick="openRoleDrawer('${r.id}')">编辑</button>
                        <button class="btn-link" type="button" ${locked ? 'disabled title="' + tip + '"' : ''} onclick="openDataScopeModal('${r.id}')">数据权限</button>
                        <button class="btn-link danger" type="button" ${locked ? 'disabled title="' + tip + '"' : ''} onclick="deleteRoles(['${r.id}'])">删除</button>
                      </td>

          <div class="pagination-bar tabular"><span>共 <strong>${rows.length}</strong> 条 · 每页 <strong>10</strong> 条</span></div>
        </section>
      `;

                <div class="field-group"><label class="field-label">手机号码</label><input id="uqPhone" class="input mono" placeholder="模糊匹配手机号" value="${esc(state.userQuery.phone)}" oninput="state.userQuery.phone=this.value" /></div>
                <div class="field-group"><label class="field-label">账号状态</label><select class="select" onchange="state.userQuery.status=this.value; render();"><option value="" ${state.userQuery.status===''?'selected':''}>全部</option><option value="0" ${state.userQuery.status==='0'?'selected':''}>正常</option><option value="1" ${state.userQuery.status==='1'?'selected':''}>停用</option></select></div>
                <div class="query-actions">
                  <button class="btn btn-primary" type="button" onclick="render()">查询</button>
                  <button class="btn" type="button" onclick="state.userQuery={username:'',phone:'',status:'',collapsed:state.userQuery.collapsed}; state.userSelectedDeptId=''; render();">重置</button>
                  <button class="btn-link" type="button" onclick="state.userQuery.collapsed=!state.userQuery.collapsed; render();">${state.userQuery.collapsed ? '展开 ▾' : '收起 ▴'}</button>
                </div>
              </div>
              ${!state.userQuery.collapsed ? `<div class="query-grid" style="margin-top:10px;"><div class="field-group"><label class="field-label">创建时间起止</label><input class="input mono" placeholder="2026-11-01 ~ 2026-11-24" /></div></div>` : ''}
            </div>

            <div class="card table-card ${state.fullscreenTable ? 'fullscreen' : ''}">

                <div class="toolbar-left">
                  <button class="btn btn-primary" type="button" onclick="openUserDrawer(null)">+ 新增用户</button>
                  <button class="btn" type="button" ${state.selectedUserIds.size === 0 ? 'disabled' : ''} onclick="deleteUsers([...state.selectedUserIds])">批量删除 (${state.selectedUserIds.size})</button>
                  <button class="btn" type="button" onclick="openImportModal()">导入</button>
                  <button class="btn" type="button" onclick="openExportMenu(event)">导出 ▾</button>
                  ${state.userSelectedDeptId ? `<span class="tag tag-primary">部门：${esc(deptMap[state.userSelectedDeptId])}（含下级）<button class="tab-close" type="button" onclick="state.userSelectedDeptId=''; render();">✕</button></span>` : ''}
                </div>
                <div class="toolbar-right">
                  <button class="icon-btn" type="button" title="刷新" onclick="render()">↻</button>

                  <button class="icon-btn" type="button" title="斑马纹" onclick="state.striped=!state.striped; render();">▤</button>
                  <button class="icon-btn" type="button" title="表格全屏" onclick="state.fullscreenTable=!state.fullscreenTable; render();">⛶</button>

                  <tbody>
                    ${rows.length === 0 ? `<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--solid-text-secondary);">未找到符合条件的用户 <button class="btn-link" onclick="state.userQuery={username:'',phone:'',status:'',collapsed:true}; state.userSelectedDeptId=''; render();">清空筛选条件</button></td></tr>` : rows.map(u => {

                          <td class="mono">${esc(u.id)}</td>

              <div class="pagination-bar tabular">

              </div>
            </div>
          </section>
        </div>
      `;
    }

    function renderModal() {
      const m = state.modal;
      if (!m) return '';
      const eff = effTenantId();

      if (m.type === 'dept') {
        const list = DB.depts[eff] || [];
        const desc = m.mode === 'edit' ? deptDescendantIds(eff, m.form.id) : new Set();
        const users = (DB.users[eff] || []).filter(u => u.status === 0 && (!m.leaderSearch.trim() || u.nickname.includes(m.leaderSearch) || u.username.includes(m.leaderSearch)));
        return `
          <div class="modal-backdrop open"><div class="dialog-panel w-640" role="dialog" aria-modal="true">
            <div class="panel-header"><span>${m.mode === 'edit' ? '编辑部门' : '新增部门'}</span><button class="icon-btn" type="button" onclick="state.modal=null; render();">✕</button></div>
            <div class="panel-body">
              <div class="form-grid-2">
                <div class="field-group">
                  <label class="field-label">上级部门 *</label>

                  </select>
                  ${m.errors.parentId ? `<div class="field-error">${esc(m.errors.parentId)}</div>` : ''}
                </div>
                <div class="field-group">
                  <label class="field-label">部门名称 *</label>
                  <input class="input ${m.errors.deptName ? 'is-error' : ''}" value="${esc(m.form.deptName)}" oninput="state.modal.form.deptName=this.value" />
                  ${m.errors.deptName ? `<div class="field-error">${esc(m.errors.deptName)}</div>` : ''}
                </div>
                <div class="field-group">

                  <select class="select" onchange="state.modal.form.leaderUserId=this.value;">
                    <option value="">暂不指定</option>
                    ${users.map(u => `<option value="${u.id}" ${m.form.leaderUserId === u.id ? 'selected' : ''}>${esc(u.nickname)} (${esc(u.username)})</option>`).join('')}

                </div>
                <div class="field-group">
                  <label class="field-label">显示排序 *</label>
                  <input class="input mono" type="number" value="${m.form.sort}" oninput="state.modal.form.sort=this.value" />
                </div>
                <div class="field-group">
                  <label class="field-label">联系电话（真明文）</label>
                  <input class="input mono ${m.errors.phone ? 'is-error' : ''}" value="${esc(m.form.phone)}" oninput="state.modal.form.phone=this.value" />
                  ${m.errors.phone ? `<div class="field-error">${esc(m.errors.phone)}</div>` : ''}
                </div>
                <div class="field-group">
                  <label class="field-label">电子邮箱（真明文）</label>
                  <input class="input mono ${m.errors.email ? 'is-error' : ''}" value="${esc(m.form.email)}" oninput="state.modal.form.email=this.value" />
                  ${m.errors.email ? `<div class="field-error">${esc(m.errors.email)}</div>` : ''}

              </div>
              <div class="field-group">
                <label class="field-label">部门状态</label>
                <div style="display:flex;gap:16px;"><label><input type="radio" name="dSt" value="0" ${Number(m.form.status) === 0 ? 'checked' : ''} onchange="state.modal.form.status=0" /> 正常</label><label><input type="radio" name="dSt" value="1" ${Number(m.form.status) === 1 ? 'checked' : ''} onchange="state.modal.form.status=1" /> 停用</label></div>
                ${m.errors.status ? `<div class="field-error">${esc(m.errors.status)}</div>` : ''}
              </div>

            <div class="panel-footer"><button class="btn" type="button" onclick="state.modal=null; render();">取消</button><button class="btn btn-primary" type="button" onclick="saveDeptModal()">保存部门</button></div>

                </table>
              </div>
              <div style="font-size:12px;color:var(--solid-text-secondary);">注：表格遵循 AtengExcelFeedback 3 列精简视图（不暴露后端 rowData），导出 CSV 附带原始提交值；批注下载链接校验操作人及租户归属（TTL 15 分钟）。</div>
            </div>
            <div class="panel-footer" style="justify-content:space-between;">
              <div style="display:flex;gap:8px;">
                <button class="btn" type="button" onclick="copyFeedbackList()">复制错误清单</button>
                <button class="btn" type="button" onclick="downloadTextFile('导入错误清单.csv', '行号,列名,错误原因,提交原始值\\n' + state.feedbackErrors.map(e=>e.rowNum+','+(e.columnName||'-')+',\"'+e.errorMessage+'\",'+(e.rawValue||'')).join('\\n'))">导出错误清单 (CSV)</button>
              </div>
              <div style="display:flex;gap:8px;">
                <button class="btn btn-primary" type="button" onclick="downloadAnnotatedExcel()">下载标红批注文件 (.xlsx)</button>
                <button class="btn" type="button" onclick="state.modal=null; render();">关闭</button>
              </div>
            </div>
          </div></div>
        `;
      }
      return '';
    }

    function render() {
      const activeId = document.activeElement?.id;
      const selStart = document.activeElement?.selectionStart;
      const selEnd = document.activeElement?.selectionEnd;

      const visMenus = visibleNavMenus();
      const curMenu = NAV_MENUS.find(m => m.path === state.activeRoute) || NAV_MENUS[4];
      const eff = tenantObj(effTenantId());
      const tenantCtrl = !state.tenantEnabled ? '' : (state.actorType === 'super_admin'
        ? `<button class="tenant-pill ${eff.id !== '0' ? 'switched' : ''}" type="button" onclick="hidePopovers(); const r=this.getBoundingClientRect(); const p=document.getElementById('tenantPopover'); p.innerHTML=TENANTS.map(t=>'<button class=\\'popover-item\\' onclick=\\'switchTenant(\\''+t.id+'\\')\\'><span>'+t.name+' ('+t.id+')</span><span>'+(t.id===state.activeTenantId?'✓':'')+'</span></button>').join(''); p.style.left=Math.min(r.left,window.innerWidth-230)+'px'; p.style.top=(r.bottom+6)+'px'; p.classList.add('open'); event.stopPropagation();"><span>租户: ${esc(eff.name)}</span><span class="mono">(${eff.id})</span><span>▾</span></button>`
        : `<span class="tenant-pill readonly">租户: ${esc(eff.name)}</span>`);
      const bannerHtml = (state.tenantEnabled && state.actorType === 'super_admin' && state.activeTenantId !== '0')
        ? `<div class="tenant-banner"><span>当前正以平台超管身份查看工作租户：<strong>${esc(eff.name)}</strong>（<span class="mono">X-Tenant-Id: ${eff.id}</span>，平台专属【菜单管理】已隔离隐藏）</span><button class="btn btn-sm" type="button" onclick="switchTenant('0')">切回平台默认租户 (0)</button></div>`
        : '';

      let bodyHtml = '';
      if (state.activeRoute === '/system/dept') bodyHtml = renderDeptPage();
      else if (state.activeRoute === '/system/post') bodyHtml = renderPostPage();
      else if (state.activeRoute === '/system/menu') bodyHtml = renderMenuPage();
      else if (state.activeRoute === '/system/role') bodyHtml = renderRolePage();
      else bodyHtml = renderUserPage();

      document.getElementById('app').innerHTML = `
        <aside class="sidebar ${state.sidebarCollapsed ? 'collapsed' : ''}">
          <div class="brand-bar"><span class="brand-logo">S</span><span class="brand-text"><span class="brand-name">ateng-solid</span><span class="brand-sub">Admin</span></span></div>
          <div class="menu-scroll">
            <div class="menu-group-label">组织权限</div>
            ${visMenus.map(m => `<button class="menu-item ${m.path === state.activeRoute ? 'active' : ''}" type="button" onclick="openRoute('${m.path}')" title="${esc(m.title)}"><span>${m.icon}</span><span class="menu-item-label">${esc(m.title)}</span></button>`).join('')}
          </div>
        </aside>
        <div class="main-column">
          <header class="topbar">
            <div class="topbar-left">
              <button class="icon-btn" type="button" onclick="state.sidebarCollapsed=!state.sidebarCollapsed; render();">☰</button>
              <nav class="breadcrumb"><span>组织权限</span><span>/</span><span class="current">${esc(curMenu.title)}</span></nav>
            </div>
            <div class="topbar-right">
              ${tenantCtrl}
              <button class="icon-btn" type="button" onclick="toggleTheme()">${state.dark ? '☀' : '☾'}</button>
              <span class="user-trigger"><span class="avatar-circle">${state.actorType === 'super_admin' ? '超' : '星'}</span><span>${state.actorType === 'super_admin' ? '陈默' : '林星辰'}</span></span>
            </div>
          </header>
          <div class="tabs-bar">
            <div class="tabs-list">
              ${state.tabs.map(t => `<div class="tab-chip ${t.path === state.activeRoute ? 'active' : ''}" onclick="openRoute('${t.path}')"><span>${esc(t.title)}</span>${t.affix ? '' : `<button class="tab-close" type="button" onclick="event.stopPropagation(); closeTab('${t.path}')">✕</button>`}</div>`).join('')}
            </div>
          </div>
          ${bannerHtml}
          <main class="workspace">${bodyHtml}</main>
        </div>
      `;

      document.getElementById('modalRoot').innerHTML = renderModal();

      // Sim bar highlight
      ['dept', 'post', 'menu', 'role', 'user'].forEach(k => document.getElementById('sim-' + k)?.classList.remove('on'));
      const activeKey = state.activeRoute.split('/').pop();
      document.getElementById('sim-' + activeKey)?.classList.add('on');
      const bt = document.getElementById('sim-theme'); bt.textContent = state.dark ? 'Dark' : 'Light'; bt.classList.toggle('on', state.dark);
      const bten = document.getElementById('sim-tenant'); bten.textContent = state.tenantEnabled ? '多租户: 开' : '多租户: 关'; bten.classList.toggle('on', state.tenantEnabled);
      const ba = document.getElementById('sim-actor'); ba.textContent = state.actorType === 'super_admin' ? `超管 (${state.activeTenantId})` : '租户管理员 (10002)'; ba.classList.toggle('on', state.actorType === 'tenant_admin' || state.activeTenantId !== '0');

      if (activeId) {
        const el = document.getElementById(activeId);
        if (el && typeof el.focus === 'function') {
          el.focus();
          if (typeof selStart === 'number' && typeof el.setSelectionRange === 'function') {
            try { el.setSelectionRange(selStart, selEnd); } catch {}
          }
        }
      }
    }

    document.addEventListener('click', () => hidePopovers());
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        hidePopovers();
        if (state.fullscreenTable) { state.fullscreenTable = false; render(); }
        if (document.getElementById('confirmBackdrop').classList.contains('open')) closeConfirm(false);
        else if (state.modal) { state.modal = null; render(); }
      }
    });

    render();
  </script>
</body>
</html>
