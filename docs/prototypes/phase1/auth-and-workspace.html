<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ateng-solid 第一阶段认证登录、工作台、个人中心与在线会话原型</title>
  <style>
    /* ============================================================
     * Precision Slate & Cobalt Design Tokens (design-system.md)
     * ============================================================ */
    :root {
      --solid-bg-canvas: #F6F7F9;
      --solid-bg-surface: #FFFFFF;
      --solid-bg-elevated: #FFFFFF;
      --solid-bg-subtle: #EEF1F5;

      --solid-text-primary: #0F172A;
      --solid-text-regular: #334155;
      --solid-text-secondary: #475569;
      --solid-text-muted: #64748B;

      --solid-primary: #1D4ED8;
      --solid-primary-hover: #1E40AF;
      --solid-primary-soft: #EFF6FF;
      --solid-primary-border: #BFDBFE;

      --solid-border: rgba(15, 23, 42, 0.10);
      --solid-border-light: rgba(15, 23, 42, 0.06);

      --solid-success: #047857;
      --solid-success-soft: #ECFDF5;
      --solid-success-border: #A7F3D0;
      --solid-warning: #B45309;
      --solid-warning-soft: #FFFBEB;
      --solid-warning-border: #FDE68A;
      --solid-danger: #DC2626;
      --solid-danger-soft: #FEF2F2;
      --solid-danger-border: #FECACA;
      --solid-info: #475569;
      --solid-info-soft: #F1F5F9;

      --solid-radius-sm: 4px;
      --solid-radius-md: 6px;
      --solid-radius-lg: 8px;
      --solid-radius-pill: 9999px;

      --solid-shadow-popover: 0 12px 28px -6px rgba(15, 23, 42, 0.14), 0 4px 10px -2px rgba(15, 23, 42, 0.06);
      --solid-focus-ring: 0 0 0 2px var(--solid-bg-surface), 0 0 0 4px var(--solid-primary);

      --solid-font-sans: 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --solid-font-mono: 'JetBrains Mono', 'Cascadia Mono', ui-monospace, SFMono-Regular, monospace;
    }

    html.dark {
      --solid-bg-canvas: #0B0F17;
      --solid-bg-surface: #111827;
      --solid-bg-elevated: #182234;
      --solid-bg-subtle: #1E293B;

      --solid-text-primary: #F8FAFC;
      --solid-text-regular: #CBD5E1;
      --solid-text-secondary: #94A3B8;
      --solid-text-muted: #64748B;

      --solid-primary: #3B82F6;
      --solid-primary-hover: #60A5FA;
      --solid-primary-soft: rgba(59, 130, 246, 0.15);
      --solid-primary-border: rgba(59, 130, 246, 0.35);

      --solid-border: rgba(226, 232, 240, 0.12);
      --solid-border-light: rgba(226, 232, 240, 0.07);

      --solid-success: #10B981;
      --solid-success-soft: rgba(16, 185, 129, 0.14);
      --solid-success-border: rgba(16, 185, 129, 0.30);
      --solid-warning: #F59E0B;
      --solid-warning-soft: rgba(245, 158, 11, 0.14);
      --solid-warning-border: rgba(245, 158, 11, 0.32);
      --solid-danger: #F87171;
      --solid-danger-soft: rgba(248, 113, 113, 0.14);
      --solid-danger-border: rgba(248, 113, 113, 0.32);
      --solid-info: #94A3B8;
      --solid-info-soft: #1E293B;

      --solid-shadow-popover: 0 16px 36px -8px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(226, 232, 240, 0.14);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: var(--solid-font-sans); font-size: 14px; line-height: 1.5;
      background: var(--solid-bg-canvas); color: var(--solid-text-primary);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font-family: inherit; }
    :focus-visible { outline: none; box-shadow: var(--solid-focus-ring); }
    .mono { font-family: var(--solid-font-mono); font-variant-numeric: tabular-nums; }
    .tabular { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }

    /* Shared Buttons, Inputs, Tags, Alerts */
    .card { background: var(--solid-bg-surface); border: 1px solid var(--solid-border); border-radius: var(--solid-radius-lg); }
    .btn {
      height: 32px; padding: 0 12px; border-radius: var(--solid-radius-md);
      border: 1px solid var(--solid-border); background: var(--solid-bg-surface);
      color: var(--solid-text-regular); font-size: 13px; font-weight: 500;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      cursor: pointer; white-space: nowrap; transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn:hover:not(:disabled) { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }
    .btn:disabled { opacity: 0.48; cursor: not-allowed; }
    .btn-lg { height: 38px; padding: 0 16px; font-size: 14px; }
    .btn-sm { height: 26px; padding: 0 9px; font-size: 12px; }
    .btn-primary { background: var(--solid-primary); border-color: var(--solid-primary); color: #FFFFFF; }
    .btn-primary:hover:not(:disabled) { background: var(--solid-primary-hover); border-color: var(--solid-primary-hover); color: #FFFFFF; }
    .btn-danger-outline { border-color: var(--solid-danger-border); color: var(--solid-danger); background: var(--solid-danger-soft); }
    .btn-link {
      border: none; background: transparent; color: var(--solid-primary);
      padding: 2px 6px; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: var(--solid-radius-sm);
    }
    .btn-link:hover:not(:disabled) { background: var(--solid-primary-soft); }
    .btn-link.danger { color: var(--solid-danger); }
    .btn-link.danger:hover:not(:disabled) { background: var(--solid-danger-soft); }
    .btn-link:disabled { color: var(--solid-text-muted); cursor: not-allowed; opacity: 0.55; }

    .icon-btn {
      width: 32px; height: 32px; border-radius: var(--solid-radius-md);
      border: 1px solid transparent; background: transparent; color: var(--solid-text-regular);
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }

    .input, .select {
      height: 34px; padding: 0 10px; border-radius: var(--solid-radius-md);
      border: 1px solid var(--solid-border); background: var(--solid-bg-surface);
      color: var(--solid-text-primary); font-size: 13px; width: 100%;
    }
    .input.lg { height: 38px; font-size: 14px; }
    .input.is-error { border-color: var(--solid-danger); }
    .input:disabled { background: var(--solid-bg-subtle); color: var(--solid-text-muted); cursor: not-allowed; }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap .input.has-suffix { padding-right: 36px; }
    .input-suffix-btn {
      position: absolute; right: 4px; width: 28px; height: 28px;
      border: none; background: transparent; color: var(--solid-text-secondary);
      cursor: pointer; border-radius: var(--solid-radius-sm); display: inline-flex; align-items: center; justify-content: center;
    }
    .input-suffix-btn:hover { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }

    .field-group { display: flex; flex-direction: column; gap: 5px; }
    .field-label { font-size: 12px; font-weight: 500; color: var(--solid-text-secondary); display: flex; align-items: center; justify-content: space-between; }
    .field-error { font-size: 12px; color: var(--solid-danger); min-height: 16px; }
    .field-hint { font-size: 12px; color: var(--solid-text-secondary); }
    .field-hint.warning { color: var(--solid-warning); font-weight: 500; }

    .tag {
      display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px;
      border-radius: var(--solid-radius-sm); font-size: 12px; font-weight: 500; white-space: nowrap;
    }
    .tag-primary { background: var(--solid-primary-soft); color: var(--solid-primary); }
    .tag-success { background: var(--solid-success-soft); color: var(--solid-success); }
    .tag-warning { background: var(--solid-warning-soft); color: var(--solid-warning); }
    .tag-danger { background: var(--solid-danger-soft); color: var(--solid-danger); }
    .tag-info { background: var(--solid-info-soft); color: var(--solid-info); }

    .alert-box {
      padding: 10px 12px; border-radius: var(--solid-radius-md); border: 1px solid var(--solid-border);
      font-size: 13px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    }
    .alert-warning { background: var(--solid-warning-soft); border-color: var(--solid-warning-border); color: var(--solid-warning); }
    .alert-danger { background: var(--solid-danger-soft); border-color: var(--solid-danger-border); color: var(--solid-danger); }
    .alert-info { background: var(--solid-primary-soft); border-color: var(--solid-primary-border); color: var(--solid-primary); }

    /* ============================================================
     * Login View (Asymmetric Dual-Column Engineering Card)
     * ============================================================ */
    .login-stage {
      min-height: 100vh; width: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px 16px 88px;
      background-color: var(--solid-bg-canvas);
      background-image: radial-gradient(var(--solid-border) 1px, transparent 1px);
      background-size: 20px 20px;
      position: relative;
    }
    .login-topbar {
      position: fixed; top: 14px; right: 16px; display: flex; align-items: center; gap: 8px; z-index: 20;
    }
    .login-card {
      width: 100%; max-width: 920px; min-height: 530px;
      display: grid; grid-template-columns: 42% 58%;
      background: var(--solid-bg-surface); border: 1px solid var(--solid-border);
      border-radius: var(--solid-radius-lg); overflow: hidden;
      box-shadow: var(--solid-shadow-popover);
    }
    .login-aside {
      background: #0F172A; color: #F8FAFC; padding: 36px 32px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 24px;
      border-right: 1px solid var(--solid-border);
    }
    html.dark .login-aside { background: #090D16; }
    .login-brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 30px; height: 30px; border-radius: var(--solid-radius-md);
      background: var(--solid-primary); color: #FFFFFF;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; flex-shrink: 0;
    }
    .login-aside-title { font-size: 20px; font-weight: 600; margin: 22px 0 8px; color: #F8FAFC; }
    .login-aside-desc { font-size: 13px; color: #CBD5E1; margin: 0; line-height: 1.65; }
    .login-spec-list { list-style: none; padding: 0; margin: 24px 0 0; display: flex; flex-direction: column; gap: 12px; }
    .login-spec-list li {
      font-size: 13px; color: #E2E8F0; display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; border-radius: var(--solid-radius-md);
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .login-spec-dot { width: 6px; height: 6px; border-radius: 50%; background: #3B82F6; margin-top: 7px; flex-shrink: 0; }
    .login-aside-foot { font-size: 12px; color: #94A3B8; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.10); padding-top: 14px; }

    .login-main { padding: 36px 38px; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
    .login-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .login-title { font-size: 20px; font-weight: 600; margin: 0; }
    .login-subtitle { font-size: 13px; color: var(--solid-text-secondary); margin: 4px 0 0; }

    .captcha-row { display: grid; grid-template-columns: 1fr 130px; gap: 10px; align-items: start; }
    .captcha-box {
      width: 130px; height: 38px; border: 1px solid var(--solid-border); border-radius: var(--solid-radius-md);
      background: var(--solid-bg-subtle); overflow: hidden; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; padding: 0;
    }
    .captcha-box:hover { border-color: var(--solid-primary); }
    .captcha-box svg { width: 100%; height: 100%; display: block; }
    .captcha-error-btn {
      width: 130px; height: 38px; border: 1px dashed var(--solid-danger); border-radius: var(--solid-radius-md);
      background: var(--solid-danger-soft); color: var(--solid-danger); font-size: 12px; cursor: pointer;
    }

    .login-options { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--solid-text-regular); }
    .check-label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .login-demo-strip {
      margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--solid-border-light);
      display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--solid-text-secondary);
    }
    .demo-btns { display: flex; flex-wrap: wrap; gap: 6px; }

    /* ============================================================
     * AdminLayout Shell (Scheme A - shell-accepted.html)
     * ============================================================ */
    .app-shell { display: flex; height: 100vh; width: 100vw; overflow: hidden; background: var(--solid-bg-canvas); }
    .sidebar {
      width: 228px; flex-shrink: 0; background: var(--solid-bg-surface);
      border-right: 1px solid var(--solid-border); display: flex; flex-direction: column;
      transition: width 0.2s ease;
    }
    .sidebar.collapsed { width: 60px; }
    .brand-bar {
      height: 48px; padding: 0 14px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--solid-border-light); flex-shrink: 0; overflow: hidden;
    }
    .brand-name { font-weight: 600; font-size: 14px; white-space: nowrap; }
    .brand-sub { font-size: 11px; color: var(--solid-text-secondary); margin-left: 2px; }
    .sidebar.collapsed .brand-text { display: none; }
    .menu-scroll { flex: 1; overflow-y: auto; padding: 10px 8px; }
    .menu-group-label { font-size: 12px; font-weight: 600; color: var(--solid-text-muted); padding: 8px 10px 4px; }
    .sidebar.collapsed .menu-group-label { display: none; }
    .menu-item {
      width: 100%; border: none; background: transparent;
      display: flex; align-items: center; gap: 9px;
      padding: 8px 10px; border-radius: var(--solid-radius-md);
      color: var(--solid-text-regular); font-size: 13px;
      cursor: pointer; text-align: left; margin-bottom: 2px;
      transition: background 0.15s, color 0.15s;
    }
    .menu-item:hover { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }
    .menu-item.active { background: var(--solid-primary-soft); color: var(--solid-primary); font-weight: 600; }
    .sidebar.collapsed .menu-item { justify-content: center; padding: 9px; }
    .sidebar.collapsed .menu-item-label { display: none; }

    .main-column { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      height: 48px; background: var(--solid-bg-surface); border-bottom: 1px solid var(--solid-border);
      padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--solid-text-secondary); white-space: nowrap; }
    .breadcrumb .current { color: var(--solid-text-primary); font-weight: 600; }

    .tenant-pill {
      display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
      border-radius: var(--solid-radius-md); border: 1px solid var(--solid-border);
      background: var(--solid-bg-subtle); color: var(--solid-text-primary); font-size: 12px; cursor: pointer;
    }
    .tenant-pill.switched { background: var(--solid-warning-soft); border-color: var(--solid-warning-border); color: var(--solid-warning); font-weight: 600; }
    .tenant-pill.readonly { cursor: default; }

    .user-trigger {
      display: inline-flex; align-items: center; gap: 8px; padding: 3px 8px 3px 4px;
      border-radius: var(--solid-radius-md); border: 1px solid transparent;
      background: transparent; color: var(--solid-text-primary); cursor: pointer; font-size: 13px;
    }
    .user-trigger:hover { background: var(--solid-bg-subtle); }
    .avatar-circle {
      width: 26px; height: 26px; border-radius: var(--solid-radius-pill);
      background: var(--solid-primary-soft); color: var(--solid-primary);
      border: 1px solid var(--solid-primary-border);
      display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
      overflow: hidden; flex-shrink: 0;
    }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .tabs-bar {
      height: 36px; background: var(--solid-bg-surface); border-bottom: 1px solid var(--solid-border);
      padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;
    }
    .tabs-list { display: flex; align-items: center; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
    .tabs-list::-webkit-scrollbar { display: none; }
    .tab-chip {
      height: 26px; padding: 0 10px; border-radius: var(--solid-radius-sm); border: 1px solid transparent;
      background: transparent; color: var(--solid-text-secondary); font-size: 12px;
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .tab-chip:hover { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }
    .tab-chip.active { background: var(--solid-primary-soft); border-color: var(--solid-primary-border); color: var(--solid-primary); font-weight: 600; }
    .tab-close {
      width: 14px; height: 14px; border-radius: 3px; border: none; background: transparent;
      color: inherit; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; padding: 0; opacity: 0.7;
    }
    .tab-close:hover { background: rgba(15, 23, 42, 0.12); opacity: 1; }
    .tabs-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

    .tenant-banner {
      background: var(--solid-warning-soft); border-bottom: 1px solid var(--solid-warning-border);
      color: var(--solid-warning); padding: 6px 16px; font-size: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0;
    }

    .workspace { flex: 1; overflow: auto; padding: 14px 16px 84px; display: flex; flex-direction: column; gap: 12px; }

    /* ============================================================
     * Dashboard View
     * ============================================================ */
    .dash-welcome {
      padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap;
    }
    .dash-welcome-left { display: flex; align-items: center; gap: 14px; }
    .dash-avatar-lg { width: 48px; height: 48px; font-size: 18px; }
    .dash-meta-strip {
      display: grid; grid-template-columns: repeat(3, minmax(160px, auto)); gap: 12px 24px;
      padding: 10px 14px; background: var(--solid-bg-canvas); border: 1px solid var(--solid-border-light);
      border-radius: var(--solid-radius-md);
    }
    .dash-meta-item { display: flex; flex-direction: column; gap: 2px; }
    .dash-meta-label { font-size: 12px; color: var(--solid-text-secondary); }
    .dash-meta-val { font-size: 13px; font-weight: 600; color: var(--solid-text-primary); }

    .section-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
    .section-title { font-size: 14px; font-weight: 600; color: var(--solid-text-primary); margin: 0; }
    .section-sub { font-size: 12px; color: var(--solid-text-secondary); }

    .dash-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .quick-card {
      padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 8px;
      text-align: left; transition: border-color 0.15s, background 0.15s;
    }
    .quick-card:hover { border-color: var(--solid-primary); background: var(--solid-primary-soft); }
    .quick-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
    .quick-card-title { font-weight: 600; font-size: 14px; color: var(--solid-text-primary); display: flex; align-items: center; gap: 8px; }
    .quick-card-foot { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--solid-text-secondary); width: 100%; }

    .dash-guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .guide-card { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
    .guide-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--solid-text-regular); }

    /* ============================================================
     * Profile View
     * ============================================================ */
    .profile-layout { display: grid; grid-template-columns: 340px 1fr; gap: 14px; align-items: start; }
    .profile-left { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .profile-avatar-box { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--solid-border-light); }
    .avatar-xl { width: 76px; height: 76px; font-size: 26px; }
    .desc-list { display: flex; flex-direction: column; }
    .desc-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 9px 0; border-bottom: 1px solid var(--solid-border-light); font-size: 13px;
    }
    .desc-row:last-child { border-bottom: none; }
    .desc-label { color: var(--solid-text-secondary); flex-shrink: 0; }
    .desc-val { color: var(--solid-text-primary); font-weight: 500; text-align: right; display: inline-flex; align-items: center; gap: 6px; word-break: break-all; }

    .profile-right { padding: 0; overflow: hidden; }
    .tab-nav-line { display: flex; border-bottom: 1px solid var(--solid-border); padding: 0 18px; gap: 20px; }
    .tab-line-btn {
      padding: 12px 2px; border: none; background: transparent; cursor: pointer;
      font-size: 14px; font-weight: 500; color: var(--solid-text-secondary);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab-line-btn.active { color: var(--solid-primary); border-bottom-color: var(--solid-primary); font-weight: 600; }
    .profile-form-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; max-width: 560px; }
    .radio-group { display: flex; gap: 14px; align-items: center; height: 34px; }
    .radio-item { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; color: var(--solid-text-regular); }

    .pwd-rules {

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
    }
    function maskPhone(p) { return !p || p.length < 7 ? '--' : p.slice(0, 3) + '****' + p.slice(-4); }
    function maskEmail(e) {
      if (!e || !e.includes('@')) return '--';
      const [n, d] = e.split('@');
      return (n.length <= 1 ? '*' : n[0] + '***') + '@' + d;
    }
    function formatTimeout(sec) {
      if (sec === -1) return '长期有效';
      if (sec <= 0) return '已过期';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) return `${h}小时${String(m).padStart(2, '0')}分`;
      if (m > 0) return `${m}分${String(s).padStart(2, '0')}秒`;
      return `${s}秒`;
    }

    // SVG Captcha Generator (alphanumeric safe)
    function generateCaptcha() {
      const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz';
      let code = '';
      for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
      state.captchaCodeText = code;
      const lines = Array.from({ length: 4 }, (_, i) => {
        const x1 = Math.floor(Math.random() * 130), y1 = Math.floor(Math.random() * 44);
        const x2 = Math.floor(Math.random() * 130), y2 = Math.floor(Math.random() * 44);
        const colors = ['#94A3B8', '#60A5FA', '#64748B', '#3B82F6'];
        return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${colors[i]}" stroke-width="1.2" opacity="0.65"/>`;
      }).join('');
      const letters = code.split('').map((ch, idx) => {
        const x = 18 + idx * 26;
        const y = 29 + Math.floor(Math.random() * 6 - 3);
        const rot = Math.floor(Math.random() * 24 - 12);
        return `<text x="${x}" y="${y}" fill="#1E293B" font-family="monospace" font-size="22" font-weight="700" transform="rotate(${rot} ${x} ${y})">${ch}</text>`;
      }).join('');
      state.captchaSvg = `<svg viewBox="0 0 130 44" xmlns="http://www.w3.org/2000/svg"><rect width="130" height="44" fill="#EFF6FF"/>${lines}${letters}</svg>`;
    }

          const ss = String(sec % 60).padStart(2, '0');
          const btn = document.getElementById('loginSubmitBtn');
          const msg = document.getElementById('loginAlertText');
          if (btn) { btn.disabled = true; btn.textContent = `已锁定 (${mm}:${ss})`; }
          if (msg) msg.textContent = `连续登录失败次数过多，账号已锁定，请在 ${Math.floor(sec / 60)} 分 ${sec % 60} 秒后重试 (101004)`;
        }
      }, 1000);
    }

    function handleLoginFieldEdit(field, val) {
      state.loginForm[field] = val;
      delete state.loginErrors[field];
      if (field === 'username' || field === 'tenantCode') {
        if (getRemainingLockSeconds() <= 0 && state.loginAlert?.code === 101004) {
          state.loginAlert = null;
          if (state.lockTimer) { clearInterval(state.lockTimer); state.lockTimer = null; }
        }
        render();
      }
    }

    function submitLogin(e) {
      if (e) e.preventDefault();
      if (state.loginLoading || state.captchaLoadFailed) return;
      if (getRemainingLockSeconds() > 0) { startLockCountdownTicker(); return; }

      state.loginErrors = {};
      state.loginAlert = null;
      const tc = state.tenantEnabled ? state.loginForm.tenantCode.trim() : '000000';
      const un = state.loginForm.username.trim();
      const pw = state.loginForm.password;
      const cap = state.loginForm.captchaCode.trim();

      let ok = true;
      if (state.tenantEnabled && !tc) { state.loginErrors.tenantCode = '请输入租户编码'; ok = false; }
      if (!un || un.length < 2) { state.loginErrors.username = '请输入 2~64 位登录账号'; ok = false; }
      if (!pw) { state.loginErrors.password = '请输入登录密码'; ok = false; }
      if (state.captchaEnabled && !cap) { state.loginErrors.captchaCode = '请输入图形验证码'; ok = false; }
      if (!ok) { render(); return; }

      state.loginLoading = true;
      render();

      setTimeout(() => {
        state.loginLoading = false;
        const failAndRefresh = (code, text) => {
          state.loginAlert = { type: 'danger', code, text };
          if (state.captchaEnabled) { generateCaptcha(); state.loginForm.captchaCode = ''; }
          render();
        };

        // Step 1: 101001 Captcha
        if (state.captchaEnabled && cap.toLowerCase() !== state.captchaCodeText.toLowerCase()) {
          state.loginErrors.captchaCode = '验证码输入有误或已过期，请重新输入';
          return failAndRefresh(101001, '图形验证码无效或已过期，已自动刷新（101001）');
        }

        // Step 2: 101005 Tenant
        const tenant = TENANTS.find(t => t.code === tc);
        if (!tenant || !tenant.active) {
          state.loginErrors.tenantCode = '租户不可用';
          return failAndRefresh(101005, `所属租户【${tc}】不存在、已停用或已过期（101005）`);
        }

        // Step 3: 101004 Pre-check Lock
        const scopeKey = getLockScopeKey();
        if (getRemainingLockSeconds() > 0) {
          const sec = getRemainingLockSeconds();
          startLockCountdownTicker();
          return failAndRefresh(101004, `连续登录失败次数过多，账号已锁定，请在 ${Math.floor(sec / 60)} 分 ${sec % 60} 秒后重试（101004）`);
        }

        // Step 4: 101002 / 101003 User & Password
        let matchedActor = null;
        if (tenant.id === '0' && un === 'super_admin' && pw === state.currentPasswordReal) matchedActor = 'super_admin';
        if (tenant.id === '10002' && un === 'xc_admin' && pw === state.currentPasswordReal) matchedActor = 'tenant_admin';
        if (tenant.id === '0' && un === 'guest_clerk' && pw === state.currentPasswordReal) matchedActor = 'no_menu_user';

        if (un === 'disabled_user') {
          return failAndRefresh(101003, '账号已被停用，请联系管理员处理（101003）');
        }

        if (!matchedActor) {
          const count = (state.failCounts[scopeKey] || 0) + 1;
          state.failCounts[scopeKey] = count;
          const remain = Math.max(0, 5 - count);
          if (remain === 0) {
            state.lockEndTimes[scopeKey] = Date.now() + 15 * 60 * 1000;
            state.failCounts[scopeKey] = 0;
            startLockCountdownTicker();
            return failAndRefresh(101004, '连续登录失败已达 5 次，账号已锁定 15 分钟（101004）');
          }
          return failAndRefresh(101002, `用户名或密码错误，还剩 ${remain} 次尝试机会（连续失败 5 次将锁定 15 分钟 · 101002）`);
        }

        // Step 5: Success + redirect guard
        delete state.failCounts[scopeKey];
        delete state.lockEndTimes[scopeKey];
        state.actorType = matchedActor;
        state.activeTenantId = tenant.id;
        if (state.loginForm.remember) {
          state.rememberedTenantCode = tc;
          state.rememberedUsername = un;
        }
        state.loginForm.password = '';
        state.loginForm.captchaCode = '';
        syncProfileFormFromModel();

        // Validate redirect
        const visible = getVisibleMenus();
        const r = state.redirectTarget || '';
        const isSafeRel = r.startsWith('/') && !r.startsWith('//') && !['/login', '/403', '/404'].includes(r);
        const canAccess = isSafeRel && (['/dashboard', '/profile'].includes(r) || visible.some(m => m.path === r));
        const dest = canAccess ? r : '/dashboard';
        state.tabs = [{ path: '/dashboard', title: '工作台', affix: true }];
        if (dest !== '/dashboard') {
          const m = visible.find(x => x.path === dest);
          state.tabs.push({ path: dest, title: m ? m.title : '个人中心', affix: false });
        }
        state.activeView = dest;
        showToast('success', canAccess ? `登录成功，已跳回 ${dest}` : (r && r !== '/dashboard' ? `登录成功，目标路径 ${r} 无权限，已兜底进入工作台` : '登录成功，欢迎回来'));
        render();
      }, 240);
    }

    function simulateLoginScenario(type) {
      if (state.activeView !== '/login') switchView('/login');
      state.loginAlert = null; state.loginErrors = {};
      if (type === 'fill_super') {
        state.loginForm.tenantCode = '000000';
        state.loginForm.username = 'super_admin';
        state.loginForm.password = state.currentPasswordReal;
        state.loginForm.captchaCode = state.captchaCodeText;
      } else if (type === 'wrong_pwd') {
        state.loginForm.tenantCode = '000000';
        state.loginForm.username = 'super_admin';
        state.loginForm.password = 'WrongPass123!';
        state.loginForm.captchaCode = state.captchaCodeText;
        submitLogin();
        return;
      } else if (type === 'trigger_lock') {
        const key = getLockScopeKey();
        state.lockEndTimes[key] = Date.now() + 14 * 60 * 1000 + 52 * 1000;
        state.loginAlert = { type: 'danger', code: 101004, text: '连续登录失败次数过多，账号已锁定，请在 14 分 52 秒后重试 (101004)' };
        startLockCountdownTicker();
      } else if (type === 'captcha_fail') {
        state.captchaLoadFailed = true;
      }
      render();
    }

    // Navigation & Tabs
    function switchView(path, opts = {}) {
      hideAllPopovers();
      if (path === '/login') {
        state.activeView = '/login';
        state.loginForm.tenantCode = state.rememberedTenantCode;
        state.loginForm.username = state.rememberedUsername;
        state.loginForm.password = '';
        state.loginForm.captchaCode = '';
        state.loginAlert = null;
        state.loginErrors = {};
        if (!state.captchaSvg) generateCaptcha();
        render();
        return;
      }
      if (path === '/profile') {
        if (opts.tab) state.profileTab = opts.tab;
        syncProfileFormFromModel();
      }
      if (!['/403', '/404', '/profile'].includes(path)) {
        const visible = getVisibleMenus();
        if (visible.length === 0 && path !== '/dashboard') {
          state.activeView = '/403';
          render();
          return;
        }
      }
      state.activeView = path;
      if (!['/403', '/404'].includes(path)) {
        const menu = ALL_MENUS.find(m => m.path === path);
        const title = path === '/profile' ? '个人中心' : (menu ? menu.title : path);
        if (!state.tabs.some(t => t.path === path)) {
          state.tabs.push({ path, title, affix: path === '/dashboard' });
        }
      }
      render();
    }

    function closeTab(path) {
      const idx = state.tabs.findIndex(t => t.path === path);
      if (idx < 0 || state.tabs[idx].affix) return;
      const wasActive = state.activeView === path;
      state.tabs.splice(idx, 1);
      if (wasActive) state.activeView = (state.tabs[idx] || state.tabs[idx - 1] || state.tabs[0]).path;
      render();
    }

    function runTabCommand(cmd, path) {
      hideAllPopovers();
      const idx = state.tabs.findIndex(t => t.path === path);
      if (idx < 0) return;
      if (cmd === 'refresh') { showToast('success', `已组件级刷新页签【${state.tabs[idx].title}】`); return; }
      if (cmd === 'close') { closeTab(path); return; }
      if (cmd === 'closeOthers') { state.tabs = state.tabs.filter(t => t.affix || t.path === path); state.activeView = path; }
      else if (cmd === 'closeLeft') { state.tabs = state.tabs.filter((t, i) => t.affix || i >= idx); if (!state.tabs.some(t => t.path === state.activeView)) state.activeView = path; }
      else if (cmd === 'closeRight') { state.tabs = state.tabs.filter((t, i) => t.affix || i <= idx); if (!state.tabs.some(t => t.path === state.activeView)) state.activeView = path; }
      else if (cmd === 'closeAll') { state.tabs = state.tabs.filter(t => t.affix); state.activeView = state.tabs[0].path; }
      render();
    }

    function switchTenant(tenantId) {
      hideAllPopovers();
      if (state.activeTenantId === tenantId) return;
      state.activeTenantId = tenantId;
      state.tabs = state.tabs.filter(t => t.affix);
      const visible = getVisibleMenus();
      if (visible.some(m => m.path === state.activeView) && state.activeView !== '/dashboard') {
        const cur = visible.find(m => m.path === state.activeView);
        state.tabs.push({ path: cur.path, title: cur.title, affix: false });
      } else if (!['/profile', '/403', '/404'].includes(state.activeView)) {
        state.activeView = '/dashboard';
      }
      showToast('warning', `已切换至【${getTenantObj(tenantId).name}】，已关闭非固定页签并重置跨租户缓存`);
      render();
    }

      state.tabs = [{ path: '/dashboard', title: '工作台', affix: true }];

      switchView('/login');

    function checkPwdStrength(pwd, oldPwd) {
      const lenOk = pwd.length >= 8 && pwd.length <= 20;
      const noSpace = pwd.length > 0 && !/\s/.test(pwd);
      const cats = [/[A-Z]/.test(pwd), /[a-z]/.test(pwd), /\d/.test(pwd), /[^A-Za-z0-9\s]/.test(pwd)].filter(Boolean).length;
      const catsOk = cats >= 3;
      const diffOk = pwd.length > 0 && pwd !== oldPwd;
      return { lenOk, noSpace, catsOk, diffOk, allOk: lenOk && noSpace && catsOk && diffOk };
    }

    function savePasswordChange() {
      state.pwdErrors = {};
      const { oldPassword, newPassword, confirmPassword } = state.pwdForm;
      const rules = checkPwdStrength(newPassword, oldPassword);
      let ok = true;
      if (!oldPassword) { state.pwdErrors.oldPassword = '请输入当前密码'; ok = false; }
      if (!rules.lenOk || !rules.noSpace || !rules.catsOk) { state.pwdErrors.newPassword = '新密码不符合 8~20 位无空白且至少含 3 类字符的要求'; ok = false; }
      else if (!rules.diffOk) { state.pwdErrors.newPassword = '新密码不能与当前密码相同'; ok = false; }
      if (confirmPassword !== newPassword) { state.pwdErrors.confirmPassword = '两次输入的新密码不一致'; ok = false; }
      if (!ok) { render(); return; }

      state.pwdSaving = true;

    }

    // Online Session Helpers (including IPv4 CIDR match)
    function ipToLong(ip) {
      const parts = ip.split('.');
      if (parts.length !== 4) return null;
      let res = 0;
      for (const p of parts) {
        const n = Number(p);
        if (!Number.isInteger(n) || n < 0 || n > 255) return null;
        res = (res << 8) + n;
      }
      return res >>> 0;
    }
    function matchIpOrCidr(ip, filter) {
      const q = filter.trim();
      if (!q) return true;
      if (!q.includes('/')) return ip.includes(q);
      const [net, bitsStr] = q.split('/');
      const bits = Number(bitsStr);
      const ipNum = ipToLong(ip);
      const netNum = ipToLong(net);
      if (ipNum === null || netNum === null || !Number.isInteger(bits) || bits < 0 || bits > 32) return false;
      const mask = bits === 0 ? 0 : (~0 << (32 - bits)) >>> 0;
      return (ipNum & mask) === (netNum & mask);
    }
    function getFilteredSessions() {
      const list = state.sessions[getEffectiveTenantId()] || [];
      return list.filter(s => {
        const u = state.onlineQuery.username.trim().toLowerCase();
        const ip = state.onlineQuery.clientIp.trim();
        if (u && !s.username.toLowerCase().includes(u) && !s.nickname.toLowerCase().includes(u)) return false;
        if (ip && !matchIpOrCidr(s.clientIp, ip)) return false;
        return true;
      });
    }
    function refreshOnlineTable() {
      state.onlineRefreshing = true;
      render();
      setTimeout(() => { state.onlineRefreshing = false; render(); }, 220);
    }
    function resetOnlineQuery() {

    function requestKickoutSession(sessionId) {
      const eff = getEffectiveTenantId();
      const row = (state.sessions[eff] || []).find(s => s.sessionId === sessionId);
      if (!row) return;

        return;

      openConfirm(

        `确认将账号 <strong>【${escapeHtml(row.username)}】</strong>（客户端 IP：<span class="mono">${escapeHtml(row.clientIp)}</span>）强制下线？下线后该会话需重新登录。`,
        () => {

          render();

    }

    function toggleTheme() { state.dark = !state.dark; document.documentElement.classList.toggle('dark', state.dark); render(); }
    function toggleTenantEnabled() {
      state.tenantEnabled = !state.tenantEnabled;
      if (!state.tenantEnabled) {
        state.activeTenantId = '0';
        if (state.actorType === 'tenant_admin') state.actorType = 'super_admin';
        state.tabs = state.tabs.filter(t => t.affix || getVisibleMenus().some(m => m.path === t.path) || t.path === '/profile');
        if (!['/login', '/dashboard', '/profile', '/403', '/404'].includes(state.activeView) && !getVisibleMenus().some(m => m.path === state.activeView)) state.activeView = '/dashboard';
      }
      syncProfileFormFromModel();
      render();
    }
    function cycleActor() {
      const order = ['super_admin', 'tenant_admin', 'no_menu_user'];
      const next = order[(order.indexOf(state.actorType) + 1) % order.length];
      state.actorType = next;
      if (next === 'tenant_admin') { state.tenantEnabled = true; state.activeTenantId = '10002'; }
      else state.activeTenantId = '0';
      syncProfileFormFromModel();
      if (state.activeView !== '/login') {
        state.tabs = state.tabs.filter(t => t.affix || t.path === '/profile' || getVisibleMenus().some(m => m.path === t.path));
        if (!['/dashboard', '/profile', '/403', '/404'].includes(state.activeView) && !getVisibleMenus().some(m => m.path === state.activeView)) {
          state.activeView = next === 'no_menu_user' ? '/403' : '/dashboard';
        }
      }
      render();
    }
    function toggleCaptchaSetting() {
      state.captchaEnabled = !state.captchaEnabled;
      state.captchaLoadFailed = false;
      render();
    }
    function togglePwdAlert() {
      state.passwordNeedsChange = !state.passwordNeedsChange;
      state.pwdBannerDismissed = false;
      render();

      return `<span class="avatar-circle ${cls}">${firstChar}</span>`;
    }

                  <label class="field-label">用户性别（字典 sys_user_gender）</label>
                  <div class="radio-group">
                    ${[['0', '男'], ['1', '女'], ['2', '未知']].map(([v, l]) => `
                      <label class="radio-item"><input type="radio" name="profGender" value="${v}" ${state.profileEdit.gender === v ? 'checked' : ''} onchange="state.profileEdit.gender='${v}'" /> ${l}</label>
                    `).join('')}
                  </div>
                </div>
                <div style="display:flex;gap:10px;padding-top:6px;">
                  <button class="btn btn-primary" type="button" ${state.profileSaving ? 'disabled' : ''} onclick="saveProfileBasic()">${state.profileSaving ? '保存中...' : '保存基本资料'}</button>
                  <button class="btn" type="button" onclick="syncProfileFormFromModel(); render();">重置还原</button>
                </div>
              </div>
            ` : `
              <div class="profile-form-body">
                <div class="alert-box alert-warning">
                  <span>修改密码成功后，后端将立即注销该账号全部管理端在线会话并自动跳转登录页，请使用新密码重新登录。</span>
                </div>
                <div class="field-group">
                  <label class="field-label" for="profOldPwd"><span>当前密码 *</span><span class="mono" style="font-size:11px;">测试原密码：${escapeHtml(state.currentPasswordReal)}</span></label>
                  <input id="profOldPwd" class="input ${state.pwdErrors.oldPassword ? 'is-error' : ''}" type="password" placeholder="请输入当前登录密码" value="${escapeHtml(state.pwdForm.oldPassword)}" oninput="state.pwdForm.oldPassword=this.value; delete state.pwdErrors.oldPassword;" />
                  ${state.pwdErrors.oldPassword ? `<div class="field-error">${escapeHtml(state.pwdErrors.oldPassword)}</div>` : ''}
                </div>
                <div class="field-group">
                  <label class="field-label" for="profNewPwd">新密码 *</label>
                  <input id="profNewPwd" class="input ${state.pwdErrors.newPassword ? 'is-error' : ''}" type="password" placeholder="请输入 8~20 位强密码" value="${escapeHtml(state.pwdForm.newPassword)}" oninput="state.pwdForm.newPassword=this.value; delete state.pwdErrors.newPassword; render();" />
                  <div class="pwd-rules">
                    <span class="pwd-rule ${rules.lenOk ? 'ok' : ''}">${rules.lenOk ? '✓' : '○'} 长度 8~20 个字符</span>
                    <span class="pwd-rule ${rules.noSpace ? 'ok' : ''}">${rules.noSpace ? '✓' : '○'} 不含空格或空白符</span>
                    <span class="pwd-rule ${rules.catsOk ? 'ok' : ''}">${rules.catsOk ? '✓' : '○'} 含大小写/数字/符号至少 3 类</span>
                    <span class="pwd-rule ${rules.diffOk ? 'ok' : ''}">${rules.diffOk ? '✓' : '○'} 不能与当前密码一致</span>
                  </div>
                  ${state.pwdErrors.newPassword ? `<div class="field-error">${escapeHtml(state.pwdErrors.newPassword)}</div>` : ''}
                </div>
                <div class="field-group">
                  <label class="field-label" for="profConfirmPwd">确认新密码 *</label>
                  <input id="profConfirmPwd" class="input ${state.pwdErrors.confirmPassword ? 'is-error' : ''}" type="password" placeholder="请再次输入新密码" value="${escapeHtml(state.pwdForm.confirmPassword)}" oninput="state.pwdForm.confirmPassword=this.value; delete state.pwdErrors.confirmPassword;" />
                  ${state.pwdErrors.confirmPassword ? `<div class="field-error">${escapeHtml(state.pwdErrors.confirmPassword)}</div>` : ''}
                </div>
                <div style="display:flex;gap:10px;padding-top:6px;">
                  <button class="btn btn-primary" type="button" ${state.pwdSaving ? 'disabled' : ''} onclick="savePasswordChange()">${state.pwdSaving ? '修改中...' : '修改密码并重新登录'}</button>
                  <button class="btn" type="button" onclick="state.pwdForm={oldPassword:'',newPassword:'',confirmPassword:''}; state.pwdErrors={}; render();">清空输入</button>
                </div>
              </div>
            `}
          </section>
        </div>
      `;
    }

    function renderOnlineView() {
      const eff = getTenantObj(getEffectiveTenantId());
      const rows = getFilteredSessions();
      const hasFilter = Boolean(state.onlineQuery.username.trim() || state.onlineQuery.clientIp.trim());
      const densityCls = state.density === 'large' ? 'density-large' : (state.density === 'small' ? 'density-small' : '');

      return `
        <section class="card query-card">
          <div class="query-grid">
            <div class="field-group">
              <label class="field-label" for="onlineQueryUser">登录账号 / 昵称</label>
              <input id="onlineQueryUser" class="input" placeholder="输入账号或昵称回车查询" value="${escapeHtml(state.onlineQuery.username)}" oninput="state.onlineQuery.username=this.value" onkeydown="if(event.key==='Enter' && !event.isComposing) refreshOnlineTable()" />
            </div>
            <div class="field-group">
              <label class="field-label" for="onlineQueryIp">客户端 IP / CIDR 网段</label>
              <input id="onlineQueryIp" class="input mono" placeholder="如 10.10.2.18 或 10.10.2.0/24" value="${escapeHtml(state.onlineQuery.clientIp)}" oninput="state.onlineQuery.clientIp=this.value" onkeydown="if(event.key==='Enter' && !event.isComposing) refreshOnlineTable()" />
            </div>
            <div class="query-actions">
              <button class="btn btn-primary" type="button" onclick="refreshOnlineTable()">查询</button>
              <button class="btn" type="button" onclick="resetOnlineQuery()">重置</button>
            </div>
          </div>
        </section>

        <section class="card table-card ${state.fullscreenTable ? 'fullscreen' : ''}">
          <div class="table-toolbar">
            <div class="toolbar-left">
              <span style="font-weight:600;font-size:14px;">在线会话列表</span>
              <span class="tag tag-info">当前视角：${escapeHtml(eff.name)} (${eff.id})</span>
              <span style="font-size:12px;color:var(--solid-text-secondary);">列表仅返回脱敏令牌串与不透明句柄，绝不下发真实 Token</span>
            </div>
            <div class="toolbar-right">
              <button class="btn btn-sm" type="button" onclick="state.onlineNetworkError=!state.onlineNetworkError; render();">${state.onlineNetworkError ? '恢复正常' : '模拟加载失败'}</button>
              <button class="icon-btn" type="button" title="刷新表格" onclick="refreshOnlineTable()">↻</button>
              <button class="icon-btn" type="button" title="切换密度 (${state.density})" onclick="const d=['default','small','large']; state.density=d[(d.indexOf(state.density)+1)%3]; render();">≣</button>
              <button class="icon-btn" type="button" title="斑马纹" onclick="state.striped=!state.striped; render();">▤</button>
              <button class="icon-btn" type="button" title="列显隐设置" onclick="openColumnMenu(event)">⚙</button>
              <button class="icon-btn" type="button" title="表格全屏" onclick="state.fullscreenTable=!state.fullscreenTable; render();">⛶</button>
            </div>
          </div>

          <div class="table-scroll" style="opacity:${state.onlineRefreshing ? 0.55 : 1};transition:opacity 0.15s;">
            <table class="data-table ${densityCls} ${state.striped ? 'striped' : ''}">
              <thead>
                <tr>
                  ${state.visibleCols.session ? '<th>会话标识 (脱敏)</th>' : ''}
                  ${state.visibleCols.username ? '<th>登录账号</th>' : ''}
                  ${state.visibleCols.nickname ? '<th>用户昵称</th>' : ''}
                  ${state.visibleCols.device ? '<th>登录终端</th>' : ''}
                  ${state.visibleCols.ip ? '<th>客户端 IP</th>' : ''}
                  ${state.visibleCols.loginTime ? '<th>登录时间</th>' : ''}
                  ${state.visibleCols.timeout ? '<th>剩余有效期</th>' : ''}
                  <th class="col-sticky-right">操作</th>
                </tr>
              </thead>
              <tbody>
                ${state.onlineNetworkError ? `
                  <tr><td colspan="8" style="text-align:center;padding:36px;">
                    <div style="color:var(--solid-danger);font-weight:600;">在线会话列表加载失败</div>
                    <div style="font-size:12px;color:var(--solid-text-secondary);margin:6px 0 10px;">无法连接会话监控服务，请稍后重试。</div>
                    <button class="btn btn-sm btn-primary" type="button" onclick="state.onlineNetworkError=false; refreshOnlineTable();">重试</button>
                  </td></tr>
                ` : (rows.length === 0 ? `
                  <tr><td colspan="8" style="text-align:center;padding:36px;">
                    <div style="font-weight:600;color:var(--solid-text-primary);">${hasFilter ? '未找到符合筛选条件的在线会话' : '当前租户暂无活跃在线会话'}</div>
                    ${hasFilter ? `<div style="margin-top:8px;"><button class="btn btn-sm" type="button" onclick="resetOnlineQuery()">清空筛选条件</button></div>` : ''}
                  </td></tr>
                ` : rows.map(s => `
                  <tr>
                    ${state.visibleCols.session ? `<td class="mono">${escapeHtml(s.tokenMask)} ${s.currentSession ? '<span class="tag tag-primary">当前会话</span>' : ''}</td>` : ''}
                    ${state.visibleCols.username ? `<td class="mono">${escapeHtml(s.username)}</td>` : ''}
                    ${state.visibleCols.nickname ? `<td>${escapeHtml(s.nickname)}</td>` : ''}
                    ${state.visibleCols.device ? `<td><span class="tag tag-info mono">${escapeHtml(s.loginDevice)}</span></td>` : ''}
                    ${state.visibleCols.ip ? `<td class="mono">${escapeHtml(s.clientIp)}</td>` : ''}
                    ${state.visibleCols.loginTime ? `<td class="mono">${escapeHtml(s.loginTime)}</td>` : ''}
                    ${state.visibleCols.timeout ? `<td class="tabular">${s.tokenTimeout <= 300 && s.tokenTimeout > 0 ? `<span class="tag tag-warning">${formatTimeout(s.tokenTimeout)} · 即将过期</span>` : `<span class="mono">${formatTimeout(s.tokenTimeout)}</span>`}</td>` : ''}
                    <td class="col-sticky-right">
                      <button class="btn-link danger" type="button" ${s.currentSession ? 'disabled title="不可强退当前正在使用的会话（101007）"' : ''} onclick="requestKickoutSession('${s.sessionId}')">强退</button>
                    </td>
                  </tr>
                `).join(''))}
              </tbody>
            </table>
          </div>

          <div class="pagination-bar tabular">
            <span>共 <strong>${state.onlineNetworkError ? 0 : rows.length}</strong> 条活跃会话 · 每页 <strong>10</strong> 条 [10 / 20 / 50 / 100]</span>
            <div style="display:flex;gap:4px;"><button class="btn btn-sm" disabled>上一页</button><button class="btn btn-sm btn-primary">1</button><button class="btn btn-sm" disabled>下一页</button></div>
          </div>
        </section>
      `;
    }

    function renderErrorView(code) {
      const is403 = code === '403';
      const noMenus = getVisibleMenus().length === 0;
      const standalone = state.errorStandalone;
      return `
        <div class="error-stage ${standalone ? 'standalone' : ''}">
          <div class="card error-card">
            <div class="error-code ${is403 ? 'danger' : ''} mono">${code}</div>
            <h2 class="error-title">${is403 ? '暂无当前页面访问权限' : '页面不存在或菜单组件未配置'}</h2>
            <p class="error-desc">
              ${is403
                ? '当前登录账号未获授予该路由或功能菜单权限，请联系系统管理员或租户管理员在【角色管理】中配置授权。'
                : '未能匹配到目标路由或动态菜单对应的前端视图组件（<span class="mono">/system/unknown-demo</span>），请检查菜单路径配置。'}
            </p>
            <div class="error-actions">
              <button class="btn btn-primary" type="button" onclick="state.errorStandalone=false; switchView('/dashboard')">返回工作台</button>
              <button class="btn" type="button" onclick="state.errorStandalone=false; switchView('/profile')">返回上一页 / 个人中心</button>
              ${is403 && noMenus ? `<button class="btn btn-danger-outline" type="button" onclick="state.errorStandalone=false; logoutNow('已退出当前无权限账号，请切换账号重新登录')">退出登录</button>` : ''}
              <button class="btn btn-sm" type="button" onclick="state.errorStandalone=!state.errorStandalone; render();">${standalone ? '切换为布局内嵌套态' : '预览独立居中态'}</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderAppShell() {
      const visibleMenus = getVisibleMenus();
      const curMenu = ALL_MENUS.find(m => m.path === state.activeView);
      const bcDomain = state.activeView === '/profile' ? '账号' : (state.activeView === '/403' || state.activeView === '/404' ? '系统提示' : (curMenu ? curMenu.domainLabel : '系统'));
      const bcTitle = state.activeView === '/profile' ? '个人中心' : (state.activeView === '/403' ? '无权访问 (403)' : (state.activeView === '/404' ? '页面不存在 (404)' : (curMenu ? curMenu.title : state.activeView)));

      const groups = [];
      visibleMenus.forEach(m => { if (!groups.includes(m.domainLabel)) groups.push(m.domainLabel); });
      const eff = getTenantObj(getEffectiveTenantId());
      const p = getProfile();

      const tenantCtrl = !state.tenantEnabled ? '' : (state.actorType === 'super_admin'
        ? `<button class="tenant-pill ${eff.id !== '0' ? 'switched' : ''}" type="button" onclick="openTenantMenu(event)"><span>租户: ${escapeHtml(eff.name)}</span><span class="mono" style="opacity:0.75;">(${eff.id})</span><span>▾</span></button>`
        : `<span class="tenant-pill readonly">租户: ${escapeHtml(eff.name)}</span>`);

      const bannerHtml = (state.tenantEnabled && state.actorType === 'super_admin' && state.activeTenantId !== '0')
        ? `<div class="tenant-banner"><span>当前正以平台超管身份查看工作租户：<strong>${escapeHtml(eff.name)}</strong>（<span class="mono">X-Tenant-Id: ${eff.id}</span>，平台专属菜单已自动隔离隐藏）</span><button class="btn btn-sm" type="button" onclick="switchTenant('0')">切回平台默认租户 (0)</button></div>`
        : '';

      let bodyHtml = '';
      if (state.activeView === '/dashboard') bodyHtml = renderDashboardView();
      else if (state.activeView === '/profile') bodyHtml = renderProfileView();
      else if (state.activeView === '/system/online') bodyHtml = renderOnlineView();
      else if (state.activeView === '/403') bodyHtml = renderErrorView('403');
      else if (state.activeView === '/404') bodyHtml = renderErrorView('404');
      else bodyHtml = `<div class="card" style="padding:20px;display:flex;flex-direction:column;gap:10px;"><div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:16px;font-weight:600;">${escapeHtml(bcTitle)}</span><span class="tag tag-primary mono">${escapeHtml(state.activeView)}</span></div><p style="margin:0;color:var(--solid-text-secondary);">本页面属于后续业务域 PRD 工单范围，当前原型聚焦认证登录、工作台、个人中心、在线会话与异常页。</p><div><button class="btn btn-primary" type="button" onclick="switchView('/system/online')">返回【在线会话】</button></div></div>`;

      return `
        <div class="app-shell">
          <aside class="sidebar ${state.sidebarCollapsed ? 'collapsed' : ''} ${state.maximized ? 'hidden' : ''}">
            <div class="brand-bar"><span class="brand-logo">S</span><span class="brand-text"><span class="brand-name">ateng-solid</span><span class="brand-sub">Admin</span></span></div>
            <div class="menu-scroll">
              ${groups.length === 0
                ? `<div style="padding:12px 10px;font-size:12px;color:var(--solid-text-secondary);">暂无已授权业务菜单</div>`
                : groups.map(g => `<div class="menu-group-label">${escapeHtml(g)}</div>${visibleMenus.filter(m => m.domainLabel === g).map(m => `<button class="menu-item ${m.path === state.activeView ? 'active' : ''}" type="button" onclick="switchView('${m.path}')" title="${escapeHtml(m.title)}"><span>${m.icon}</span><span class="menu-item-label">${escapeHtml(m.title)}</span></button>`).join('')}`).join('')}
            </div>
          </aside>
          <div class="main-column">
            <header class="topbar ${state.maximized ? 'hidden' : ''}">
              <div class="topbar-left">
                <button class="icon-btn" type="button" title="折叠/展开侧栏" aria-label="折叠或展开侧栏" onclick="state.sidebarCollapsed=!state.sidebarCollapsed; render();">☰</button>
                <nav class="breadcrumb" aria-label="面包屑"><span>${escapeHtml(bcDomain)}</span><span>/</span><span class="current">${escapeHtml(bcTitle)}</span></nav>
              </div>
              <div class="topbar-right">
                ${tenantCtrl}
                <button class="icon-btn" type="button" title="切换亮/暗色" aria-label="切换亮暗色模式" onclick="toggleTheme()">${state.dark ? '☀' : '☾'}</button>
                <button class="user-trigger" type="button" onclick="openUserMenu(event)">${renderAvatar(p)}<span>${escapeHtml(p.nickname)}</span><span style="font-size:11px;opacity:0.7;">▾</span></button>
              </div>
            </header>
            <div class="tabs-bar">
              <div class="tabs-list">
                ${state.tabs.map(t => `<div class="tab-chip ${t.path === state.activeView ? 'active' : ''}" onclick="switchView('${t.path}')" oncontextmenu="openTabContextMenu(event, '${t.path}')"><span>${escapeHtml(t.title)}</span>${t.affix ? '' : `<button class="tab-close" type="button" aria-label="关闭页签" onclick="event.stopPropagation(); closeTab('${t.path}')">✕</button>`}</div>`).join('')}
              </div>
              <div class="tabs-actions">
                <button class="icon-btn" type="button" title="刷新当前页" onclick="runTabCommand('refresh', '${state.activeView}')">↻</button>
                <button class="icon-btn" type="button" title="最大化工作区" onclick="state.maximized=!state.maximized; render();">${state.maximized ? '⤡' : '⤢'}</button>
              </div>
            </div>
            ${bannerHtml}
            <main class="workspace">${bodyHtml}</main>
          </div>
        </div>
      `;
    }

    function updateSimBar() {
      const map = {
        '/login': 'sim-login',
        '/dashboard': 'sim-dashboard',
        '/profile': 'sim-profile',
        '/system/online': 'sim-online',
        '/403': 'sim-403',
        '/404': 'sim-404',
      };
      Object.values(map).forEach(id => document.getElementById(id)?.classList.remove('on'));
      if (map[state.activeView]) document.getElementById(map[state.activeView]).classList.add('on');

      const btnTheme = document.getElementById('sim-theme');
      btnTheme.textContent = state.dark ? 'Dark' : 'Light';
      btnTheme.classList.toggle('on', state.dark);

      const btnTenant = document.getElementById('sim-tenant');
      btnTenant.textContent = state.tenantEnabled ? '多租户: 开' : '多租户: 关';
      btnTenant.classList.toggle('on', state.tenantEnabled);

      const btnActor = document.getElementById('sim-actor');
      btnActor.textContent = state.actorType === 'super_admin' ? `超管 (${state.activeTenantId})` : (state.actorType === 'tenant_admin' ? '租户管理员 (10002)' : '无菜单专员');
      btnActor.classList.toggle('on', state.actorType !== 'super_admin');

      const btnCap = document.getElementById('sim-captcha');
      btnCap.textContent = state.captchaEnabled ? '验证码: 开' : '验证码: 关';
      btnCap.classList.toggle('on', state.captchaEnabled);

      const btnPwd = document.getElementById('sim-pwd-tip');
      btnPwd.textContent = state.passwordNeedsChange ? '初始口令提醒: 开' : '初始口令提醒: 关';
      btnPwd.classList.toggle('on', state.passwordNeedsChange);
    }

    function render() {
      const activeId = document.activeElement?.id;
      const selStart = document.activeElement?.selectionStart;
      const selEnd = document.activeElement?.selectionEnd;

      const root = document.getElementById('app');
      if (state.activeView === '/login') root.innerHTML = renderLoginView();
      else if ((state.activeView === '/403' || state.activeView === '/404') && state.errorStandalone) root.innerHTML = renderErrorView(state.activeView.slice(1));
      else root.innerHTML = renderAppShell();

      updateSimBar();

      if (activeId) {
        const nextEl = document.getElementById(activeId);
        if (nextEl && typeof nextEl.focus === 'function') {
          nextEl.focus();
          if (typeof selStart === 'number' && typeof nextEl.setSelectionRange === 'function') {
            try { nextEl.setSelectionRange(selStart, selEnd); } catch {}
          }
        }
      }
    }

    document.addEventListener('click', () => hideAllPopovers());
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        hideAllPopovers();
        if (state.fullscreenTable) { state.fullscreenTable = false; render(); }
        if (state.maximized) { state.maximized = false; render(); }
        if (document.getElementById('confirmBackdrop').classList.contains('open')) closeConfirm(false);
      }
    });

    generateCaptcha();
    syncProfileFormFromModel();
    render();
  </script>
</body>
</html>
