<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ateng-solid 第一阶段（MVP 内核）全站高保真可交互原型套件</title>
  <style>
    /* ============================================================
     * Precision Slate & Cobalt Design Tokens (design-system.md)
     * ============================================================ */
    :root {
      --solid-bg-canvas: #F6F7F9;
      --solid-bg-surface: #FFFFFF;
      --solid-bg-elevated: #FFFFFF;
      --solid-bg-subtle: #EEF1F5;
      --solid-text-primary: #0F172A;
      --solid-text-regular: #334155;
      --solid-text-secondary: #475569;
      --solid-text-muted: #64748B;
      --solid-primary: #1D4ED8;
      --solid-primary-hover: #1E40AF;
      --solid-primary-soft: #EFF6FF;
      --solid-primary-border: #BFDBFE;
      --solid-border: rgba(15, 23, 42, 0.10);
      --solid-border-light: rgba(15, 23, 42, 0.06);
      --solid-success: #047857;
      --solid-success-soft: #ECFDF5;
      --solid-success-border: #A7F3D0;
      --solid-warning: #B45309;
      --solid-warning-soft: #FFFBEB;
      --solid-warning-border: #FDE68A;
      --solid-danger: #DC2626;
      --solid-danger-soft: #FEF2F2;
      --solid-danger-border: #FECACA;
      --solid-info: #475569;
      --solid-info-soft: #F1F5F9;
      --solid-radius-sm: 4px;
      --solid-radius-md: 6px;
      --solid-radius-lg: 8px;
      --solid-radius-pill: 9999px;
      --solid-shadow-popover: 0 12px 28px -6px rgba(15, 23, 42, 0.14), 0 4px 10px -2px rgba(15, 23, 42, 0.06);
      --solid-focus-ring: 0 0 0 2px var(--solid-bg-surface), 0 0 0 4px var(--solid-primary);
      --solid-font-sans: 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --solid-font-mono: 'JetBrains Mono', 'Cascadia Mono', ui-monospace, SFMono-Regular, monospace;
    }
    html.dark {
      --solid-bg-canvas: #0B0F17;
      --solid-bg-surface: #111827;
      --solid-bg-elevated: #182234;
      --solid-bg-subtle: #1E293B;
      --solid-text-primary: #F8FAFC;
      --solid-text-regular: #CBD5E1;
      --solid-text-secondary: #94A3B8;
      --solid-text-muted: #64748B;
      --solid-primary: #3B82F6;
      --solid-primary-hover: #60A5FA;
      --solid-primary-soft: rgba(59, 130, 246, 0.15);
      --solid-primary-border: rgba(59, 130, 246, 0.35);
      --solid-border: rgba(226, 232, 240, 0.12);
      --solid-border-light: rgba(226, 232, 240, 0.07);
      --solid-success: #10B981;
      --solid-success-soft: rgba(16, 185, 129, 0.14);
      --solid-success-border: rgba(16, 185, 129, 0.30);
      --solid-warning: #F59E0B;
      --solid-warning-soft: rgba(245, 158, 11, 0.14);
      --solid-warning-border: rgba(245, 158, 11, 0.32);
      --solid-danger: #F87171;
      --solid-danger-soft: rgba(248, 113, 113, 0.14);
      --solid-danger-border: rgba(248, 113, 113, 0.32);
      --solid-info: #94A3B8;
      --solid-info-soft: #1E293B;
      --solid-shadow-popover: 0 16px 36px -8px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(226, 232, 240, 0.14);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: var(--solid-font-sans); font-size: 14px; line-height: 1.5; background: var(--solid-bg-canvas); color: var(--solid-text-primary); -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font-family: inherit; }
    :focus-visible { outline: none; box-shadow: var(--solid-focus-ring); }
    .mono { font-family: var(--solid-font-mono); font-variant-numeric: tabular-nums; }
    .tabular { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }

    /* Shared UI */
    .card { background: var(--solid-bg-surface); border: 1px solid var(--solid-border); border-radius: var(--solid-radius-lg); }
    .btn { height: 32px; padding: 0 12px; border-radius: var(--solid-radius-md); border: 1px solid var(--solid-border); background: var(--solid-bg-surface); color: var(--solid-text-regular); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; white-space: nowrap; }
    .btn:hover:not(:disabled) { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-lg { height: 38px; padding: 0 16px; font-size: 14px; }
    .btn-sm { height: 26px; padding: 0 9px; font-size: 12px; }
    .btn-primary { background: var(--solid-primary); border-color: var(--solid-primary); color: #FFFFFF; }
    .btn-primary:hover:not(:disabled) { background: var(--solid-primary-hover); border-color: var(--solid-primary-hover); color: #FFFFFF; }
    .btn-link { border: none; background: transparent; color: var(--solid-primary); padding: 2px 6px; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: var(--solid-radius-sm); }
    .btn-link:hover:not(:disabled) { background: var(--solid-primary-soft); }
    .btn-link.danger { color: var(--solid-danger); }
    .btn-link.danger:hover:not(:disabled) { background: var(--solid-danger-soft); }
    .btn-link:disabled { color: var(--solid-text-muted); cursor: not-allowed; opacity: 0.55; }
    .icon-btn { width: 32px; height: 32px; border-radius: var(--solid-radius-md); border: 1px solid transparent; background: transparent; color: var(--solid-text-regular); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .icon-btn:hover { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }

    .input, .select, .textarea { height: 32px; padding: 0 10px; border-radius: var(--solid-radius-md); border: 1px solid var(--solid-border); background: var(--solid-bg-surface); color: var(--solid-text-primary); font-size: 13px; width: 100%; }
    .input.lg { height: 38px; font-size: 14px; }
    .textarea { height: auto; min-height: 60px; padding: 8px 10px; resize: vertical; }
    .input.is-error, .select.is-error { border-color: var(--solid-danger); }
    .input:disabled, .select:disabled { background: var(--solid-bg-subtle); color: var(--solid-text-muted); cursor: not-allowed; }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap .input.has-suffix { padding-right: 36px; }
    .input-suffix-btn { position: absolute; right: 4px; width: 28px; height: 28px; border: none; background: transparent; color: var(--solid-text-secondary); cursor: pointer; border-radius: var(--solid-radius-sm); display: inline-flex; align-items: center; justify-content: center; }

    .field-group { display: flex; flex-direction: column; gap: 4px; }
    .field-label { font-size: 12px; font-weight: 500; color: var(--solid-text-secondary); display: flex; align-items: center; justify-content: space-between; }
    .field-error { font-size: 12px; color: var(--solid-danger); }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: var(--solid-radius-sm); font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
    .tag-default { background: var(--solid-bg-subtle); border-color: var(--solid-border); color: var(--solid-text-regular); }
    .tag-primary { background: var(--solid-primary-soft); border-color: var(--solid-primary-border); color: var(--solid-primary); }
    .tag-success { background: var(--solid-success-soft); border-color: var(--solid-success-border); color: var(--solid-success); }
    .tag-warning { background: var(--solid-warning-soft); border-color: var(--solid-warning-border); color: var(--solid-warning); }
    .tag-danger { background: var(--solid-danger-soft); border-color: var(--solid-danger-border); color: var(--solid-danger); }
    .tag-info { background: var(--solid-info-soft); color: var(--solid-info); }

    .switch { width: 34px; height: 18px; border-radius: var(--solid-radius-pill); background: var(--solid-text-muted); border: none; position: relative; cursor: pointer; vertical-align: middle; }
    .switch.on { background: var(--solid-primary); }
    .switch:disabled { opacity: 0.45; cursor: not-allowed; }
    .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
    .switch.on::after { transform: translateX(16px); }

    .alert-box { padding: 9px 12px; border-radius: var(--solid-radius-md); border: 1px solid var(--solid-border); font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .alert-warning { background: var(--solid-warning-soft); border-color: var(--solid-warning-border); color: var(--solid-warning); }
    .alert-danger { background: var(--solid-danger-soft); border-color: var(--solid-danger-border); color: var(--solid-danger); }
    .alert-info { background: var(--solid-primary-soft); border-color: var(--solid-primary-border); color: var(--solid-primary); }

    /* Login Stage */
    .login-stage { min-height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px 88px; background-color: var(--solid-bg-canvas); background-image: radial-gradient(var(--solid-border) 1px, transparent 1px); background-size: 20px 20px; }
    .login-card { width: 100%; max-width: 920px; min-height: 520px; display: grid; grid-template-columns: 42% 58%; background: var(--solid-bg-surface); border: 1px solid var(--solid-border); border-radius: var(--solid-radius-lg); overflow: hidden; box-shadow: var(--solid-shadow-popover); }
    .login-aside { background: #0F172A; color: #F8FAFC; padding: 34px 30px; display: flex; flex-direction: column; justify-content: space-between; gap: 20px; }
    html.dark .login-aside { background: #090D16; }
    .login-spec-list { list-style: none; padding: 0; margin: 20px 0 0; display: flex; flex-direction: column; gap: 10px; }
    .login-spec-list li { font-size: 13px; color: #E2E8F0; padding: 9px 12px; border-radius: var(--solid-radius-md); background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); }
    .login-main { padding: 34px 36px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
    .captcha-row { display: grid; grid-template-columns: 1fr 130px; gap: 10px; }
    .captcha-box { width: 130px; height: 38px; border: 1px solid var(--solid-border); border-radius: var(--solid-radius-md); overflow: hidden; cursor: pointer; padding: 0; background: var(--solid-bg-subtle); }

    /* AdminLayout Shell (Scheme A) */
    .app-shell { display: flex; height: 100vh; width: 100vw; overflow: hidden; background: var(--solid-bg-canvas); }
    .sidebar { width: 228px; flex-shrink: 0; background: var(--solid-bg-surface); border-right: 1px solid var(--solid-border); display: flex; flex-direction: column; transition: width 0.2s ease; }
    .sidebar.collapsed { width: 60px; }
    .brand-bar { height: 48px; padding: 0 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--solid-border-light); flex-shrink: 0; overflow: hidden; }
    .brand-logo { width: 28px; height: 28px; border-radius: var(--solid-radius-md); background: var(--solid-primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
    .brand-name { font-weight: 600; font-size: 14px; white-space: nowrap; }
    .brand-sub { font-size: 11px; color: var(--solid-text-secondary); margin-left: 2px; }
    .sidebar.collapsed .brand-text, .sidebar.collapsed .menu-group-label, .sidebar.collapsed .menu-item-label { display: none; }
    .menu-scroll { flex: 1; overflow-y: auto; padding: 8px; }
    .menu-group-label { font-size: 12px; font-weight: 600; color: var(--solid-text-muted); padding: 8px 10px 4px; }
    .menu-item { width: 100%; border: none; background: transparent; display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: var(--solid-radius-md); color: var(--solid-text-regular); font-size: 13px; cursor: pointer; text-align: left; margin-bottom: 2px; }
    .menu-item:hover { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }
    .menu-item.active { background: var(--solid-primary-soft); color: var(--solid-primary); font-weight: 600; }
    .sidebar.collapsed .menu-item { justify-content: center; padding: 9px; }

    .main-column { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 48px; background: var(--solid-bg-surface); border-bottom: 1px solid var(--solid-border); padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }
    .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--solid-text-secondary); white-space: nowrap; }
    .breadcrumb .current { color: var(--solid-text-primary); font-weight: 600; }

    .tenant-pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--solid-radius-md); border: 1px solid var(--solid-border); background: var(--solid-bg-subtle); color: var(--solid-text-primary); font-size: 12px; cursor: pointer; }
    .tenant-pill.switched { background: var(--solid-warning-soft); border-color: var(--solid-warning-border); color: var(--solid-warning); font-weight: 600; }
    .tenant-pill.readonly { cursor: default; }
    .user-trigger { display: inline-flex; align-items: center; gap: 8px; padding: 3px 8px 3px 4px; border-radius: var(--solid-radius-md); border: 1px solid transparent; background: transparent; color: var(--solid-text-primary); cursor: pointer; font-size: 13px; }
    .user-trigger:hover { background: var(--solid-bg-subtle); }
    .avatar-circle { width: 26px; height: 26px; border-radius: var(--solid-radius-pill); background: var(--solid-primary-soft); color: var(--solid-primary); border: 1px solid var(--solid-primary-border); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; overflow: hidden; flex-shrink: 0; }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .tabs-bar { height: 36px; background: var(--solid-bg-surface); border-bottom: 1px solid var(--solid-border); padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; }
    .tabs-list { display: flex; align-items: center; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
    .tabs-list::-webkit-scrollbar { display: none; }
    .tab-chip { height: 26px; padding: 0 10px; border-radius: var(--solid-radius-sm); border: 1px solid transparent; background: transparent; color: var(--solid-text-secondary); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .tab-chip:hover { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }
    .tab-chip.active { background: var(--solid-primary-soft); border-color: var(--solid-primary-border); color: var(--solid-primary); font-weight: 600; }
    .tab-close { width: 14px; height: 14px; border-radius: 3px; border: none; background: transparent; color: inherit; cursor: pointer; font-size: 11px; padding: 0; opacity: 0.7; }

    .tenant-banner { background: var(--solid-warning-soft); border-bottom: 1px solid var(--solid-warning-border); color: var(--solid-warning); padding: 6px 16px; font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }
    .workspace { flex: 1; overflow: auto; padding: 14px 16px 84px; display: flex; flex-direction: column; gap: 12px; }

    /* Views */
    .dash-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .quick-card { padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; text-align: left; }
    .quick-card:hover { border-color: var(--solid-primary); background: var(--solid-primary-soft); }
    .profile-layout { display: grid; grid-template-columns: 330px 1fr; gap: 14px; align-items: start; }
    .split-wrap { display: flex; gap: 12px; min-height: 0; flex: 1; }
    .dept-panel { width: 220px; flex-shrink: 0; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .dept-node { display: flex; align-items: center; padding: 6px 8px; border-radius: var(--solid-radius-sm); font-size: 13px; color: var(--solid-text-regular); cursor: pointer; }
    .dept-node:hover { background: var(--solid-bg-subtle); }
    .dept-node.active { background: var(--solid-primary-soft); color: var(--solid-primary); font-weight: 600; }
    .table-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    .dict-split { display: grid; grid-template-columns: 42% 58%; gap: 12px; min-height: 0; flex: 1; }
    .row-selected { background: var(--solid-primary-soft) !important; }

    .query-card { padding: 12px 14px; }
    .query-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 10px 14px; align-items: end; }
    .query-actions { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
    .table-card { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
    .table-card.fullscreen { position: fixed; inset: 12px; z-index: 900; box-shadow: var(--solid-shadow-popover); }
    .table-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .table-scroll { overflow: auto; border: 1px solid var(--solid-border); border-radius: var(--solid-radius-md); }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.data-table th { background: var(--solid-bg-subtle); color: var(--solid-text-secondary); font-weight: 600; text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--solid-border); white-space: nowrap; }
    table.data-table td { padding: 9px 12px; border-bottom: 1px solid var(--solid-border-light); color: var(--solid-text-regular); white-space: nowrap; }
    table.data-table.density-large th, table.data-table.density-large td { padding: 12px; }
    table.data-table.density-small th, table.data-table.density-small td { padding: 5px 10px; font-size: 12px; }
    table.data-table.striped tbody tr:nth-child(even) { background: var(--solid-bg-canvas); }
    table.data-table tbody tr:hover { background: var(--solid-primary-soft); }
    .col-sticky-right { position: sticky; right: 0; background: var(--solid-bg-surface); border-left: 1px solid var(--solid-border-light); }
    th.col-sticky-right { background: var(--solid-bg-subtle); }
    .ellipsis { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: middle; }
    .pagination-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--solid-text-secondary); padding-top: 2px; }

    .tree-box { border: 1px solid var(--solid-border); border-radius: var(--solid-radius-md); padding: 10px 12px; background: var(--solid-bg-canvas); max-height: 240px; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
    .tree-row { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: var(--solid-radius-sm); font-size: 13px; }
    .code-pre { margin: 0; padding: 10px 12px; font-family: var(--solid-font-mono); font-size: 12px; max-height: 210px; overflow: auto; white-space: pre-wrap; word-break: break-all; background: var(--solid-bg-canvas); border: 1px solid var(--solid-border); border-radius: var(--solid-radius-md); }

    /* Popovers, Modals, Toasts, SimBar */
    .popover-menu { position: fixed; z-index: 1200; min-width: 175px; background: var(--solid-bg-elevated); border: 1px solid var(--solid-border); border-radius: var(--solid-radius-md); box-shadow: var(--solid-shadow-popover); padding: 5px; display: none; flex-direction: column; gap: 2px; }
    .popover-menu.open { display: flex; }
    .popover-item { border: none; background: transparent; padding: 7px 10px; border-radius: var(--solid-radius-sm); font-size: 13px; color: var(--solid-text-regular); text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .popover-item:hover:not(:disabled) { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }
    .popover-item:disabled { opacity: 0.4; cursor: not-allowed; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .drawer-backdrop { justify-content: flex-end; }
    .drawer-panel { width: 520px; max-width: 100vw; height: 100vh; background: var(--solid-bg-surface); border-left: 1px solid var(--solid-border); display: flex; flex-direction: column; box-shadow: var(--solid-shadow-popover); }
    .drawer-panel.size-large { width: 720px; }
    .dialog-panel { width: 520px; max-width: calc(100vw - 32px); max-height: 90vh; background: var(--solid-bg-surface); border: 1px solid var(--solid-border); border-radius: var(--solid-radius-lg); box-shadow: var(--solid-shadow-popover); display: flex; flex-direction: column; }
    .dialog-panel.w-720 { width: 720px; }
    .panel-header { padding: 14px 18px; border-bottom: 1px solid var(--solid-border); display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; flex-shrink: 0; }
    .panel-body { padding: 16px 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .panel-footer { padding: 12px 18px; border-top: 1px solid var(--solid-border); display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-shrink: 0; }

    .toast-stack { position: fixed; top: 16px; right: 16px; z-index: 1500; display: flex; flex-direction: column; gap: 8px; max-width: 440px; }
    .toast-item { background: var(--solid-bg-elevated); border: 1px solid var(--solid-border); border-left: 3px solid var(--solid-primary); border-radius: var(--solid-radius-md); box-shadow: var(--solid-shadow-popover); padding: 10px 14px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
    .toast-item.danger { border-left-color: var(--solid-danger); }
    .toast-item.warning { border-left-color: var(--solid-warning); }
    .toast-item.success { border-left-color: var(--solid-success); }

    function generateCaptcha() {
      const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz';
      let code = '';
      for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
      state.captchaText = code;
      state.captchaSvg = `<svg viewBox="0 0 130 44" xmlns="http://www.w3.org/2000/svg"><rect width="130" height="44" fill="#EFF6FF"/><line x1="8" y1="12" x2="122" y2="34" stroke="#94A3B8" stroke-width="1.2"/><text x="20" y="30" fill="#1E293B" font-family="monospace" font-size="22" font-weight="700">${code}</text></svg>`;
    }

    // Navigation & Mode Controls
    function switchView(path, opts = {}) {
      hidePopovers();
      state.networkErrorSim = false;
      if (path === '/login') {
        state.activeRoute = '/login';
        state.loginAlert = null;
        generateCaptcha();
        render(); return;
      }
      if (!['/dashboard', '/profile', '/403', '/404'].includes(path)) {
        const vis = visibleMenus();
        if (state.actorType === 'no_menu_user') { state.activeRoute = '/403'; render(); return; }
        if (!vis.some(m => m.path === path)) { state.activeRoute = '/403'; render(); return; }
      }
      state.activeRoute = path;
      if (path === '/profile' && opts.tab) state.profileTab = opts.tab;
      if (!['/403', '/404'].includes(path)) {
        const m = DB.menus.find(x => x.path === path);
        const title = path === '/profile' ? '个人中心' : (m ? m.title : path);
        if (!state.tabs.some(t => t.path === path)) state.tabs.push({ path, title, affix: path === '/dashboard' });
      }
      render();
    }
    function closeTab(path) {
      const idx = state.tabs.findIndex(t => t.path === path);
      if (idx < 0 || state.tabs[idx].affix) return;
      const was = state.activeRoute === path;
      state.tabs.splice(idx, 1);
      if (was) state.activeRoute = (state.tabs[idx] || state.tabs[idx - 1] || state.tabs[0]).path;
      render();
    }
    function runTabCommand(cmd, path) {
      hidePopovers();
      const idx = state.tabs.findIndex(t => t.path === path);
      if (idx < 0) return;
      if (cmd === 'refresh') { showToast('success', `已组件级刷新页签【${state.tabs[idx].title}】`); return; }
      if (cmd === 'close') { closeTab(path); return; }
      if (cmd === 'closeOthers') { state.tabs = state.tabs.filter(t => t.affix || t.path === path); state.activeRoute = path; }
      else if (cmd === 'closeLeft') { state.tabs = state.tabs.filter((t, i) => t.affix || i >= idx); if (!state.tabs.some(t => t.path === state.activeRoute)) state.activeRoute = path; }
      else if (cmd === 'closeRight') { state.tabs = state.tabs.filter((t, i) => t.affix || i <= idx); if (!state.tabs.some(t => t.path === state.activeRoute)) state.activeRoute = path; }
      else if (cmd === 'closeAll') { state.tabs = state.tabs.filter(t => t.affix); state.activeRoute = state.tabs[0].path; }
      render();
    }
    function switchTenant(id) {

      const vis = visibleMenus();
      state.tabs = state.tabs.filter(t => t.affix);
      if (vis.some(m => m.path === state.activeRoute) && state.activeRoute !== '/dashboard') {
        const m = vis.find(x => x.path === state.activeRoute);

    // Login Handler
    function doLogin(e) {
      e.preventDefault();
      if (state.lockUntil > Date.now()) return;
      const tc = state.tenantEnabled ? state.loginForm.tenantCode.trim() : '000000';
      const un = state.loginForm.username.trim();
      const pw = state.loginForm.password;
      const cap = state.loginForm.captchaCode.trim();
      const refreshCap = () => { generateCaptcha(); state.loginForm.captchaCode = ''; };

      if (state.captchaEnabled && cap.toLowerCase() !== state.captchaText.toLowerCase()) {
        state.loginAlert = '图形验证码无效或已过期，已自动刷新 (101001)';
        refreshCap(); render(); return;
      }
      const ten = DB.tenants.find(t => t.tenantCode === tc);
      if (!ten || ten.status !== 0 || (ten.expireTime && ten.expireTime < '2026-11-24 18:30:00')) {
        state.loginAlert = `所属租户【${tc}】不存在、已停用或已过期 (101005)`;
        refreshCap(); render(); return;
      }
      if (!pw || pw !== (state.realPasswords[un] || 'Ateng@2026')) {
        state.failCount++;
        const rem = Math.max(0, 5 - state.failCount);
        (DB.loginLogs[ten.id] ||= []).unshift({ id: String(Date.now()).slice(-5), traceId: 'trc-lg-' + Math.random().toString(36).slice(2, 6), username: un, loginType: 'admin', clientIp: '10.10.2.18', browser: 'Chrome 130', os: 'Windows 10', status: 1, msg: rem ? `密码错误 (101002)` : `连续失败已锁定 (101004)`, loginTime: '2026-11-24 18:32:00' });
        if (rem === 0) { state.lockUntil = Date.now() + 15 * 60 * 1000; state.loginAlert = '连续登录失败已达 5 次，账号已锁定 15 分钟 (101004)'; }
        else state.loginAlert = `用户名或密码错误，还剩 ${rem} 次机会 (101002)`;
        refreshCap(); render(); return;
      }
      state.failCount = 0; state.lockUntil = 0; state.loginAlert = null;
      state.actorType = ten.id === '10002' ? 'tenant_admin' : (un === 'guest_clerk' ? 'no_menu_user' : 'super_admin');
      state.activeTenantId = ten.id;
      state.loginForm.password = ''; state.loginForm.captchaCode = '';
      (DB.loginLogs[ten.id] ||= []).unshift({ id: String(Date.now()).slice(-5), traceId: 'trc-lg-' + Math.random().toString(36).slice(2, 6), username: un, loginType: 'admin', clientIp: '10.10.2.18', browser: 'Chrome 130', os: 'Windows 10', status: 0, msg: '登录成功', loginTime: '2026-11-24 18:32:00' });

      showToast('success', `欢迎回来，${currentActorUser().nickname}`);
    }

            <div class="panel-body">
              <div class="alert-box alert-danger"><span>共解析 14 行，发现 3 处错误，<strong>整批 0 条入库</strong>。已写入一条操作审计记录（可前往操作日志查看）。</span></div>
              <table class="data-table"><thead><tr><th>行号</th><th>列名</th><th>错误原因</th></tr></thead><tbody>${errs.map(e => `<tr><td class="mono">第 ${e.rowNum} 行</td><td><span class="tag tag-info">${e.col}</span></td><td>${e.msg}</td></tr>`).join('')}</tbody></table>
            </div>
            <div class="panel-footer"><button class="btn btn-primary" onclick="showToast('success','已校验归属并下载标红批注 .xlsx'); state.modal=null; render();">下载标红批注文件 (.xlsx)</button><button class="btn" onclick="state.modal=null; render();">关闭</button></div>
          </div></div>
        `;
      }

      if (m.type === 'datascope') {
        const depts = DB.depts[eff] || [];
        return `
          <div class="modal-backdrop open"><div class="dialog-panel" role="dialog" aria-modal="true">
            <div class="panel-header"><span>分配 @DataScope · ${esc(m.role.roleName)}</span><button class="icon-btn" onclick="state.modal=null; render();">✕</button></div>
            <div class="panel-body">
              <div class="field-group"><label class="field-label">数据范围</label><select class="select" onchange="state.modal.dataScope=Number(this.value); state.modal.err=''; render();">${DATA_SCOPES.map(d => `<option value="${d.code}" ${m.dataScope === d.code ? 'selected' : ''}>${d.label}</option>`).join('')}</select></div>
              ${Number(m.dataScope) === 2 ? `
                <div class="field-group"><label class="field-label">自定部门树 *（至少选 1 个）</label>${m.err ? `<div class="field-error">${esc(m.err)}</div>` : ''}<div class="tree-box">${depts.map(d => `<label class="tree-row"><input type="checkbox" ${m.deptIds.has(d.id) ? 'checked' : ''} onchange="this.checked?state.modal.deptIds.add('${d.id}'):state.modal.deptIds.delete('${d.id}'); state.modal.err='';" /> ${esc(d.deptName)}</label>`).join('')}</div></div>
              ` : ''}
            </div>
            <div class="panel-footer"><button class="btn" onclick="state.modal=null; render();">取消</button><button class="btn btn-primary" onclick="saveDataScope()">保存数据权限</button></div>
          </div></div>
        `;
      }

      if (m.type === 'oper_detail') {
        const l = m.log;
        return `
          <div class="modal-backdrop drawer-backdrop open"><div class="drawer-panel size-large" role="dialog" aria-modal="true">
            <div class="panel-header"><span>操作日志详情 · ${esc(l.traceId)}</span><button class="icon-btn" onclick="state.modal=null; render();">✕</button></div>
            <div class="panel-body">
              <div class="field-group"><label class="field-label">请求参数 (敏感键自动替换为 [EXCLUDED])</label><pre class="code-pre">${esc(l.requestParams)}</pre></div>
              <div class="field-group"><label class="field-label">响应结果</label><pre class="code-pre">${esc(l.responseResult || '--')}</pre></div>
            </div>
            <div class="panel-footer"><button class="btn btn-primary" onclick="state.modal=null; render();">关闭</button></div>
          </div></div>
        `;
      }
      return '';
    }

    function openTenantPopover(e, btn) {
      if (e && e.stopPropagation) e.stopPropagation();
      hidePopovers();
      const r = btn.getBoundingClientRect();
      const p = document.getElementById('tenantPopover');
      p.innerHTML = DB.tenants.filter(t => t.status === 0).map(t =>
        `<button class="popover-item" onclick="switchTenant('${t.id}')"><span>${esc(t.tenantName)} (${t.id})</span><span>${t.id === state.activeTenantId ? '✓' : ''}</span></button>`
      ).join('');
      p.style.left = Math.min(r.left, window.innerWidth - 220) + 'px';
      p.style.top = (r.bottom + 6) + 'px';
      p.classList.add('open');
    }

    function openUserPopover(e, btn) {
      if (e && e.stopPropagation) e.stopPropagation();
      hidePopovers();
      const r = btn.getBoundingClientRect();
      const p = document.getElementById('userPopover');
      p.innerHTML = `
        <button class="popover-item" onclick="switchView('/profile',{tab:'basic'})">个人中心</button>
        <button class="popover-item" onclick="switchView('/profile',{tab:'password'})">修改密码</button>
        <button class="popover-item" style="color:var(--solid-danger);" onclick="switchView('/login')">退出登录</button>
      `;
      p.style.left = Math.min(r.right - 175, window.innerWidth - 190) + 'px';
      p.style.top = (r.bottom + 6) + 'px';
      p.classList.add('open');
    }

    function openTabContextMenu(e, path) {
      if (e && e.preventDefault) e.preventDefault();
      if (e && e.stopPropagation) e.stopPropagation();
      hidePopovers();
      const idx = state.tabs.findIndex(t => t.path === path);
      const tab = idx >= 0 ? state.tabs[idx] : null;
      const hasLeftClosable = state.tabs.some((t, i) => i < idx && !t.affix);
      const hasRightClosable = state.tabs.some((t, i) => i > idx && !t.affix);
      const m = document.getElementById('tabContextMenu');
      m.innerHTML = `
        <button class="popover-item" onclick="runTabCommand('refresh','${path}')">刷新当前页</button>
        <button class="popover-item" ${tab?.affix ? 'disabled' : ''} onclick="runTabCommand('close','${path}')">关闭当前</button>
        <button class="popover-item" ${!hasLeftClosable ? 'disabled' : ''} onclick="runTabCommand('closeLeft','${path}')">关闭左侧</button>
        <button class="popover-item" ${!hasRightClosable ? 'disabled' : ''} onclick="runTabCommand('closeRight','${path}')">关闭右侧</button>
        <button class="popover-item" onclick="runTabCommand('closeOthers','${path}')">关闭其他</button>
        <button class="popover-item" onclick="runTabCommand('closeAll','${path}')">关闭全部</button>
      `;
      m.style.left = Math.min(e?.clientX || 0, window.innerWidth - 185) + 'px';
      m.style.top = Math.min(e?.clientY || 0, window.innerHeight - 230) + 'px';
      m.classList.add('open');
    }

    function render() {
      const activeId = document.activeElement?.id;
      const selStart = document.activeElement?.selectionStart;
      const selEnd = document.activeElement?.selectionEnd;

      const root = document.getElementById('app');
      if (state.activeRoute === '/login') {
        root.className = '';
        root.innerHTML = renderLogin();
      } else {
        root.className = 'app-shell';
        const vis = visibleMenus();
        const groups = [];
        vis.forEach(m => { if (!groups.includes(m.domainLabel)) groups.push(m.domainLabel); });
        const curMenu = DB.menus.find(m => m.path === state.activeRoute);
        const bcTitle = state.activeRoute === '/profile' ? '个人中心' : (state.activeRoute === '/403' ? '无权访问 (403)' : (state.activeRoute === '/404' ? '页面不存在 (404)' : (curMenu?.title || '工作台')));
        const eff = tenantObj(effTenantId());
        const u = currentActorUser();

        const tenantCtrl = !state.tenantEnabled ? '' : (state.actorType === 'super_admin'
          ? `<button class="tenant-pill ${eff.id !== '0' ? 'switched' : ''}" type="button" onclick="openTenantPopover(event, this)"><span>租户: ${esc(eff.tenantName)}</span><span class="mono">(${eff.id})</span><span>▾</span></button>`
          : `<span class="tenant-pill readonly">租户: ${esc(eff.tenantName)}</span>`);
        const bannerHtml = (state.tenantEnabled && state.actorType === 'super_admin' && state.activeTenantId !== '0')
          ? `<div class="tenant-banner"><span>当前正以平台超管身份查看工作租户：<strong>${esc(eff.tenantName)}</strong>（<span class="mono">X-Tenant-Id: ${eff.id}</span>，平台专属菜单已自动隔离隐藏）</span><button class="btn btn-sm" type="button" onclick="switchTenant('0')">切回平台默认租户 (0)</button></div>`
          : '';

        let bodyHtml = '';
        if (state.activeRoute === '/dashboard') bodyHtml = renderDashboard();
        else if (state.activeRoute === '/profile') bodyHtml = renderProfile();
        else if (state.activeRoute === '/403' || state.activeRoute === '/404') {
          const is403 = state.activeRoute === '/403';
          bodyHtml = `<div style="flex:1;display:flex;align-items:center;justify-content:center;"><div class="card" style="padding:32px;text-align:center;max-width:480px;display:flex;flex-direction:column;align-items:center;gap:12px;"><span class="tag ${is403 ? 'tag-danger' : 'tag-primary'} mono" style="font-size:32px;height:auto;padding:8px 16px;">${is403 ? '403' : '404'}</span><h2 style="margin:0;">${is403 ? '暂无当前页面访问权限' : '页面不存在或菜单组件未配置'}</h2><div style="display:flex;gap:8px;"><button class="btn btn-primary" onclick="switchView('/dashboard')">返回工作台</button>${is403 && vis.length === 0 ? `<button class="btn" onclick="switchView('/login')">退出登录</button>` : ''}</div></div></div>`;
        } else bodyHtml = renderBusinessModule();

        root.innerHTML = `
          <aside class="sidebar ${state.sidebarCollapsed ? 'collapsed' : ''} ${state.maximized ? 'hidden' : ''}">
            <div class="brand-bar"><span class="brand-logo">S</span><span class="brand-text"><span class="brand-name">ateng-solid</span><span class="brand-sub">Admin</span></span></div>
            <div class="menu-scroll">
              ${vis.length === 0 ? `<div style="padding:12px;font-size:12px;color:var(--solid-text-secondary);">暂无授权菜单</div>` : groups.map(g => `<div class="menu-group-label">${g}</div>${vis.filter(m => m.domainLabel === g).map(m => `<button class="menu-item ${m.path === state.activeRoute ? 'active' : ''}" type="button" onclick="switchView('${m.path}')"><span>${m.icon}</span><span class="menu-item-label">${esc(m.title)}</span></button>`).join('')}`).join('')}
            </div>
          </aside>
          <div class="main-column">
            <header class="topbar ${state.maximized ? 'hidden' : ''}">
              <div class="topbar-left"><button class="icon-btn" type="button" onclick="state.sidebarCollapsed=!state.sidebarCollapsed; render();">☰</button><nav class="breadcrumb"><span>${esc(curMenu?.domainLabel || '系统')}</span><span>/</span><span class="current">${esc(bcTitle)}</span></nav></div>
              <div class="topbar-right">
                ${tenantCtrl}
                <button class="icon-btn" type="button" onclick="toggleTheme()">${state.dark ? '☀' : '☾'}</button>
                <button class="user-trigger" type="button" onclick="openUserPopover(event, this)"><span class="avatar-circle">${esc(u.nickname.slice(0, 1))}</span><span>${esc(u.nickname)}</span></button>
              </div>
            </header>
            <div class="tabs-bar">
              <div class="tabs-list">${state.tabs.map(t => `<div class="tab-chip ${t.path === state.activeRoute ? 'active' : ''}" onclick="switchView('${t.path}')" oncontextmenu="openTabContextMenu(event, '${t.path}')"><span>${esc(t.title)}</span>${t.affix ? '' : `<button class="tab-close" type="button" onclick="event.stopPropagation(); closeTab('${t.path}')">✕</button>`}</div>`).join('')}</div>
              <div style="display:flex;gap:4px;"><button class="icon-btn" title="刷新当前页" onclick="runTabCommand('refresh','${state.activeRoute}')">↻</button><button class="icon-btn" title="最大化工作区" onclick="state.maximized=!state.maximized; render();">${state.maximized ? '⤡' : '⤢'}</button></div>
            </div>
            ${bannerHtml}
            <main class="workspace">${bodyHtml}</main>
          </div>
        `;
      }

      document.getElementById('modalRoot').innerHTML = renderModal();

      const simMap = { '/login': 'sim-login', '/dashboard': 'sim-dash', '/system/user': 'sim-user', '/system/role': 'sim-role', '/system/tenant': 'sim-ten', '/system/tenant-package': 'sim-ten' };
      ['sim-login', 'sim-dash', 'sim-user', 'sim-role', 'sim-ten'].forEach(id => document.getElementById(id)?.classList.remove('on'));
      if (simMap[state.activeRoute]) document.getElementById(simMap[state.activeRoute]).classList.add('on');
      const bt = document.getElementById('sim-theme'); bt.textContent = state.dark ? 'Dark' : 'Light'; bt.classList.toggle('on', state.dark);
      const bten = document.getElementById('sim-tenant-on'); bten.textContent = state.tenantEnabled ? '多租户: 开' : '多租户: 关'; bten.classList.toggle('on', state.tenantEnabled);
      const ba = document.getElementById('sim-actor'); ba.textContent = state.actorType === 'super_admin' ? `超管 (${state.activeTenantId})` : (state.actorType === 'tenant_admin' ? '租户管理员' : '无菜单专员'); ba.classList.toggle('on', state.actorType !== 'super_admin' || state.activeTenantId !== '0');

      if (activeId) {
        const el = document.getElementById(activeId);
        if (el && typeof el.focus === 'function') {
          el.focus();
          if (typeof selStart === 'number' && typeof el.setSelectionRange === 'function') {
            try { el.setSelectionRange(selStart, selEnd); } catch {}
          }
        }
      }
    }

    document.addEventListener('click', () => hidePopovers());
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        hidePopovers();
        if (state.maximized) { state.maximized = false; render(); }
        if (state.fullscreenTable) { state.fullscreenTable = false; render(); }
        if (document.getElementById('confirmBackdrop').classList.contains('open')) closeConfirm(false);
        else if (state.modal) { state.modal = null; render(); }
      }
    });

    generateCaptcha();
    render();
  </script>
</body>
</html>
