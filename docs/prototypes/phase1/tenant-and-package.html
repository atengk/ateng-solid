<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ateng-solid 第一阶段 SaaS 多租户与租户套餐管理原型</title>
  <style>
    :root {
      --solid-bg-canvas: #F6F7F9;
      --solid-bg-surface: #FFFFFF;
      --solid-bg-elevated: #FFFFFF;
      --solid-bg-subtle: #EEF1F5;
      --solid-text-primary: #0F172A;
      --solid-text-regular: #334155;
      --solid-text-secondary: #475569;
      --solid-text-muted: #64748B;
      --solid-primary: #1D4ED8;
      --solid-primary-hover: #1E40AF;
      --solid-primary-soft: #EFF6FF;
      --solid-primary-border: #BFDBFE;
      --solid-border: rgba(15, 23, 42, 0.10);
      --solid-border-light: rgba(15, 23, 42, 0.06);
      --solid-success: #047857;
      --solid-success-soft: #ECFDF5;
      --solid-warning: #B45309;
      --solid-warning-soft: #FFFBEB;
      --solid-warning-border: #FDE68A;
      --solid-danger: #DC2626;
      --solid-danger-soft: #FEF2F2;
      --solid-danger-border: #FECACA;
      --solid-info: #475569;
      --solid-info-soft: #F1F5F9;
      --solid-radius-sm: 4px;
      --solid-radius-md: 6px;
      --solid-radius-lg: 8px;
      --solid-radius-pill: 9999px;
      --solid-shadow-popover: 0 12px 28px -6px rgba(15, 23, 42, 0.14), 0 4px 10px -2px rgba(15, 23, 42, 0.06);
      --solid-focus-ring: 0 0 0 2px var(--solid-bg-surface), 0 0 0 4px var(--solid-primary);
      --solid-font-sans: 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --solid-font-mono: 'JetBrains Mono', 'Cascadia Mono', ui-monospace, SFMono-Regular, monospace;
    }
    html.dark {
      --solid-bg-canvas: #0B0F17;
      --solid-bg-surface: #111827;
      --solid-bg-elevated: #182234;
      --solid-bg-subtle: #1E293B;
      --solid-text-primary: #F8FAFC;
      --solid-text-regular: #CBD5E1;
      --solid-text-secondary: #94A3B8;
      --solid-text-muted: #64748B;
      --solid-primary: #3B82F6;
      --solid-primary-hover: #60A5FA;
      --solid-primary-soft: rgba(59, 130, 246, 0.15);
      --solid-primary-border: rgba(59, 130, 246, 0.35);
      --solid-border: rgba(226, 232, 240, 0.12);
      --solid-border-light: rgba(226, 232, 240, 0.07);
      --solid-success: #10B981;
      --solid-success-soft: rgba(16, 185, 129, 0.14);
      --solid-warning: #F59E0B;
      --solid-warning-soft: rgba(245, 158, 11, 0.14);
      --solid-warning-border: rgba(245, 158, 11, 0.32);
      --solid-danger: #F87171;
      --solid-danger-soft: rgba(248, 113, 113, 0.14);
      --solid-danger-border: rgba(248, 113, 113, 0.32);
      --solid-info: #94A3B8;
      --solid-info-soft: #1E293B;
      --solid-shadow-popover: 0 16px 36px -8px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(226, 232, 240, 0.14);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: var(--solid-font-sans); font-size: 14px; line-height: 1.5; background: var(--solid-bg-canvas); color: var(--solid-text-primary); -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font-family: inherit; }
    :focus-visible { outline: none; box-shadow: var(--solid-focus-ring); }
    .mono { font-family: var(--solid-font-mono); font-variant-numeric: tabular-nums; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* Shell */
    .app-shell { display: flex; height: 100vh; width: 100vw; overflow: hidden; background: var(--solid-bg-canvas); }
    .sidebar { width: 228px; flex-shrink: 0; background: var(--solid-bg-surface); border-right: 1px solid var(--solid-border); display: flex; flex-direction: column; transition: width 0.2s ease; }
    .sidebar.collapsed { width: 60px; }
    .brand-bar { height: 48px; padding: 0 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--solid-border-light); flex-shrink: 0; overflow: hidden; }
    .brand-logo { width: 28px; height: 28px; border-radius: var(--solid-radius-md); background: var(--solid-primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
    .brand-name { font-weight: 600; font-size: 14px; white-space: nowrap; }
    .brand-sub { font-size: 11px; color: var(--solid-text-secondary); margin-left: 2px; }
    .sidebar.collapsed .brand-text, .sidebar.collapsed .menu-group-label, .sidebar.collapsed .menu-item-label { display: none; }
    .menu-scroll { flex: 1; overflow-y: auto; padding: 10px 8px; }
    .menu-group-label { font-size: 12px; font-weight: 600; color: var(--solid-text-muted); padding: 8px 10px 4px; }
    .menu-item { width: 100%; border: none; background: transparent; display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: var(--solid-radius-md); color: var(--solid-text-regular); font-size: 13px; cursor: pointer; text-align: left; margin-bottom: 2px; }
    .menu-item:hover { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }
    .menu-item.active { background: var(--solid-primary-soft); color: var(--solid-primary); font-weight: 600; }
    .sidebar.collapsed .menu-item { justify-content: center; padding: 9px; }

    .main-column { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 48px; background: var(--solid-bg-surface); border-bottom: 1px solid var(--solid-border); padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }
    .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--solid-text-secondary); white-space: nowrap; }
    .breadcrumb .current { color: var(--solid-text-primary); font-weight: 600; }

    .tenant-pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--solid-radius-md); border: 1px solid var(--solid-border); background: var(--solid-bg-subtle); color: var(--solid-text-primary); font-size: 12px; cursor: pointer; }
    .tenant-pill.switched { background: var(--solid-warning-soft); border-color: var(--solid-warning-border); color: var(--solid-warning); font-weight: 600; }
    .user-trigger { display: inline-flex; align-items: center; gap: 8px; padding: 3px 8px 3px 4px; font-size: 13px; }
    .avatar-circle { width: 26px; height: 26px; border-radius: var(--solid-radius-pill); background: var(--solid-primary-soft); color: var(--solid-primary); border: 1px solid var(--solid-primary-border); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }

    .tabs-bar { height: 36px; background: var(--solid-bg-surface); border-bottom: 1px solid var(--solid-border); padding: 0 12px; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .tab-chip { height: 26px; padding: 0 10px; border-radius: var(--solid-radius-sm); border: 1px solid transparent; background: transparent; color: var(--solid-text-secondary); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
    .tab-chip.active { background: var(--solid-primary-soft); border-color: var(--solid-primary-border); color: var(--solid-primary); font-weight: 600; }
    .tab-close { width: 14px; height: 14px; border-radius: 3px; border: none; background: transparent; color: inherit; cursor: pointer; font-size: 11px; padding: 0; opacity: 0.7; }

    .tenant-banner { background: var(--solid-warning-soft); border-bottom: 1px solid var(--solid-warning-border); color: var(--solid-warning); padding: 6px 16px; font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }
    .workspace { flex: 1; overflow: auto; padding: 14px 16px 84px; display: flex; flex-direction: column; gap: 12px; }

    /* Shared Controls */
    .card { background: var(--solid-bg-surface); border: 1px solid var(--solid-border); border-radius: var(--solid-radius-lg); }
    .btn { height: 32px; padding: 0 12px; border-radius: var(--solid-radius-md); border: 1px solid var(--solid-border); background: var(--solid-bg-surface); color: var(--solid-text-regular); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; white-space: nowrap; }
    .btn:hover:not(:disabled) { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-sm { height: 26px; padding: 0 9px; font-size: 12px; }
    .btn-primary { background: var(--solid-primary); border-color: var(--solid-primary); color: #FFFFFF; }
    .btn-primary:hover:not(:disabled) { background: var(--solid-primary-hover); border-color: var(--solid-primary-hover); color: #FFFFFF; }
    .btn-link { border: none; background: transparent; color: var(--solid-primary); padding: 2px 6px; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: var(--solid-radius-sm); }
    .btn-link:hover:not(:disabled) { background: var(--solid-primary-soft); }
    .btn-link.danger { color: var(--solid-danger); }
    .btn-link.danger:hover:not(:disabled) { background: var(--solid-danger-soft); }
    .btn-link:disabled { color: var(--solid-text-muted); cursor: not-allowed; opacity: 0.55; }
    .icon-btn { width: 32px; height: 32px; border-radius: var(--solid-radius-md); border: 1px solid transparent; background: transparent; color: var(--solid-text-regular); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .icon-btn:hover { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }

    .input, .select, .textarea { height: 32px; padding: 0 10px; border-radius: var(--solid-radius-md); border: 1px solid var(--solid-border); background: var(--solid-bg-surface); color: var(--solid-text-primary); font-size: 13px; width: 100%; }
    .textarea { height: auto; min-height: 60px; padding: 8px 10px; resize: vertical; }
    .input.is-error, .select.is-error { border-color: var(--solid-danger); }
    .input:disabled, .select:disabled { background: var(--solid-bg-subtle); color: var(--solid-text-muted); cursor: not-allowed; }
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    .field-label { font-size: 12px; font-weight: 500; color: var(--solid-text-secondary); display: flex; align-items: center; justify-content: space-between; }
    .field-error { font-size: 12px; color: var(--solid-danger); }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: var(--solid-radius-sm); font-size: 12px; font-weight: 500; white-space: nowrap; }
    .tag-primary { background: var(--solid-primary-soft); color: var(--solid-primary); }
    .tag-success { background: var(--solid-success-soft); color: var(--solid-success); }
    .tag-warning { background: var(--solid-warning-soft); color: var(--solid-warning); }
    .tag-danger { background: var(--solid-danger-soft); color: var(--solid-danger); }
    .tag-info { background: var(--solid-info-soft); color: var(--solid-info); }

    .switch { width: 34px; height: 18px; border-radius: var(--solid-radius-pill); background: var(--solid-text-muted); border: none; position: relative; cursor: pointer; vertical-align: middle; }
    .switch.on { background: var(--solid-primary); }
    .switch:disabled { opacity: 0.45; cursor: not-allowed; }
    .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
    .switch.on::after { transform: translateX(16px); }

    .alert-box { padding: 9px 12px; border-radius: var(--solid-radius-md); border: 1px solid var(--solid-border); font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .alert-warning { background: var(--solid-warning-soft); border-color: var(--solid-warning-border); color: var(--solid-warning); }
    .alert-danger { background: var(--solid-danger-soft); border-color: var(--solid-danger-border); color: var(--solid-danger); }
    .alert-info { background: var(--solid-primary-soft); border-color: var(--solid-primary-border); color: var(--solid-primary); }

    .query-card { padding: 12px 14px; }
    .query-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 10px 14px; align-items: end; }
    .query-actions { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
    .table-card { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
    .table-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .table-scroll { overflow: auto; border: 1px solid var(--solid-border); border-radius: var(--solid-radius-md); }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.data-table th { background: var(--solid-bg-subtle); color: var(--solid-text-secondary); font-weight: 600; text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--solid-border); white-space: nowrap; }
    table.data-table td { padding: 9px 12px; border-bottom: 1px solid var(--solid-border-light); color: var(--solid-text-regular); white-space: nowrap; }
    table.data-table tbody tr:hover { background: var(--solid-primary-soft); }
    .col-sticky-right { position: sticky; right: 0; background: var(--solid-bg-surface); border-left: 1px solid var(--solid-border-light); }
    th.col-sticky-right { background: var(--solid-bg-subtle); }
    .pagination-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--solid-text-secondary); padding-top: 2px; }

    .tree-box { border: 1px solid var(--solid-border); border-radius: var(--solid-radius-md); padding: 10px 12px; background: var(--solid-bg-canvas); max-height: 270px; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
    .tree-row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: var(--solid-radius-sm); font-size: 13px; }
    .tree-row:hover { background: var(--solid-bg-subtle); }
    .tree-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; font-size: 12px; }
    .section-divider { font-size: 12px; font-weight: 600; color: var(--solid-text-secondary); padding: 6px 0 4px; border-bottom: 1px solid var(--solid-border-light); margin-top: 4px; }

    .popover-menu { position: fixed; z-index: 1200; min-width: 190px; background: var(--solid-bg-elevated); border: 1px solid var(--solid-border); border-radius: var(--solid-radius-md); box-shadow: var(--solid-shadow-popover); padding: 5px; display: none; flex-direction: column; gap: 2px; }
    .popover-menu.open { display: flex; }
    .popover-item { border: none; background: transparent; padding: 7px 10px; border-radius: var(--solid-radius-sm); font-size: 13px; color: var(--solid-text-regular); text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .popover-item:hover:not(:disabled) { background: var(--solid-bg-subtle); color: var(--solid-text-primary); }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .drawer-backdrop { justify-content: flex-end; }
    .drawer-panel { width: 540px; max-width: 100vw; height: 100vh; background: var(--solid-bg-surface); border-left: 1px solid var(--solid-border); display: flex; flex-direction: column; box-shadow: var(--solid-shadow-popover); }
    .drawer-panel.size-large { width: 720px; }
    .dialog-panel { width: 520px; max-width: calc(100vw - 32px); max-height: 90vh; background: var(--solid-bg-surface); border: 1px solid var(--solid-border); border-radius: var(--solid-radius-lg); box-shadow: var(--solid-shadow-popover); display: flex; flex-direction: column; }
    .panel-header { padding: 14px 18px; border-bottom: 1px solid var(--solid-border); display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; flex-shrink: 0; }
    .panel-body { padding: 16px 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .panel-footer { padding: 12px 18px; border-top: 1px solid var(--solid-border); display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-shrink: 0; }

    .toast-stack { position: fixed; top: 16px; right: 16px; z-index: 1500; display: flex; flex-direction: column; gap: 8px; max-width: 440px; }
    .toast-item { background: var(--solid-bg-elevated); border: 1px solid var(--solid-border); border-left: 3px solid var(--solid-primary); border-radius: var(--solid-radius-md); box-shadow: var(--solid-shadow-popover); padding: 10px 14px; font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .toast-item.danger { border-left-color: var(--solid-danger); }
    .toast-item.warning { border-left-color: var(--solid-warning); }
    .toast-item.success { border-left-color: var(--solid-success); }

    .sim-bar { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 1400; background: #0F172A; color: #F8FAFC; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: var(--solid-radius-pill); padding: 6px 12px; display: flex; align-items: center; gap: 6px; box-shadow: 0 18px 40px -8px rgba(0, 0, 0, 0.45); font-size: 12px; max-width: calc(100vw - 24px); overflow-x: auto; white-space: nowrap; }
    .sim-btn { border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.08); color: #F8FAFC; padding: 3px 9px; border-radius: var(--solid-radius-pill); cursor: pointer; font-size: 12px; }
    .sim-btn:hover { background: rgba(255, 255, 255, 0.16); }
    .sim-btn.on { border-color: #60A5FA; background: rgba(37, 99, 235, 0.45); font-weight: 600; }
    .sim-sep { width: 1px; height: 14px; background: rgba(255, 255, 255, 0.22); flex-shrink: 0; }

    @media (max-width: 960px) { .query-grid, .form-grid-2 { grid-template-columns: 1fr; } .drawer-panel, .drawer-panel.size-large { width: 100vw; } }
  </style>
</head>
<body>
  <div id="app" class="app-shell"></div>
  <div id="tenantPopover" class="popover-menu" role="menu"></div>
  <div id="confirmBackdrop" class="modal-backdrop">
    <div class="dialog-panel" role="dialog" aria-modal="true">
      <div class="panel-header"><span id="confirmTitle">确认操作</span><button class="icon-btn" type="button" onclick="closeConfirm(false)">✕</button></div>
      <div class="panel-body" id="confirmMessage"></div>
      <div class="panel-footer"><button class="btn" type="button" onclick="closeConfirm(false)">取消</button><button id="confirmOkBtn" class="btn btn-primary" type="button" onclick="closeConfirm(true)">确认执行</button></div>
    </div>
  </div>
  <div id="modalRoot"></div>
  <div id="toastStack" class="toast-stack" aria-live="polite"></div>

  <div class="sim-bar" aria-label="SaaS 多租户交互控制台">
    <button id="sim-tenant" class="sim-btn" type="button" onclick="openRoute('/system/tenant')">租户管理</button>
    <button id="sim-pkg" class="sim-btn" type="button" onclick="openRoute('/system/tenant-package')">租户套餐</button>
    <button id="sim-inspect" class="sim-btn" type="button" onclick="openRoute('/system/tenant-inspect')">下发角色权限校验视图</button>
    <span class="sim-sep"></span>
    <button id="sim-theme" class="sim-btn" type="button" onclick="toggleTheme()">Light</button>
    <button id="sim-enabled" class="sim-btn" type="button" onclick="toggleTenantEnabled()">多租户: 开</button>
    <button id="sim-switch" class="sim-btn" type="button" onclick="toggleSwitchTenantDemo()">视角: 平台(0)</button>
    <button class="sim-btn" type="button" onclick="simulateExpiredSession()">模拟租户过期拦截 (101005)</button>
  </div>

  <script>
    const ALL_MENUS = [
      { id: 'm_sys', parentId: '0', menuType: 'M', title: '系统管理', platformOnly: false },
      { id: 'm_user', parentId: 'm_sys', menuType: 'C', title: '用户管理', platformOnly: false },
      { id: 'm_user_imp', parentId: 'm_user', menuType: 'F', title: '导入用户', platformOnly: false },
      { id: 'm_user_exp', parentId: 'm_user', menuType: 'F', title: '导出用户', platformOnly: false },
      { id: 'm_role', parentId: 'm_sys', menuType: 'C', title: '角色管理', platformOnly: false },
      { id: 'm_dept', parentId: 'm_sys', menuType: 'C', title: '部门管理', platformOnly: false },
      { id: 'm_post', parentId: 'm_sys', menuType: 'C', title: '岗位管理', platformOnly: false },
      { id: 'm_cfg', parentId: 'm_sys', menuType: 'C', title: '系统参数', platformOnly: false },
      { id: 'm_menu', parentId: 'm_sys', menuType: 'C', title: '菜单管理', platformOnly: true },
      { id: 'm_dict', parentId: 'm_sys', menuType: 'C', title: '数据字典', platformOnly: true },
      { id: 'm_ten_dir', parentId: '0', menuType: 'M', title: '多租户治理', platformOnly: true },
      { id: 'm_ten', parentId: 'm_ten_dir', menuType: 'C', title: '租户管理', platformOnly: true },
      { id: 'm_pkg', parentId: 'm_ten_dir', menuType: 'C', title: '租户套餐', platformOnly: true },
    ];

    const DB = {
      packages: [

    // ==================== TENANT PACKAGE ACTIONS ====================
    function openPkgDrawer(id) {

      const scoped = nonPlatformMenus();
      const scopedIds = new Set(scoped.map(x => x.id));
      let checkedSet;
      if (!p) checkedSet = new Set();
      else if (p.menuCheckStrictly) checkedSet = new Set(p.menuIds.filter(mid => scopedIds.has(mid) && !scoped.some(c => c.parentId === mid)));
      else checkedSet = new Set(p.menuIds.filter(mid => scopedIds.has(mid)));

      state.modal = {
        type: 'pkg',
        mode: p ? 'edit' : 'create',
        form: p ? { ...p } : { id: '', packageName: '', status: 0, menuCheckStrictly: true, remark: '' },
        checkedMenuIds: checkedSet,
        treeExpanded: true,
        errors: {},
      };
      render();
    }
    function togglePkgMenu(menuId, checked) {
      const { form, checkedMenuIds } = state.modal;
      const scoped = nonPlatformMenus();
      if (form.menuCheckStrictly) {
        const desc = (function walk(pid, acc = new Set([pid])) {
          for (const x of scoped) if (x.parentId === pid && !acc.has(x.id)) { acc.add(x.id); walk(x.id, acc); }
          return acc;
        })(menuId);
        desc.forEach(id => checked ? checkedMenuIds.add(id) : checkedMenuIds.delete(id));
      } else {
        checked ? checkedMenuIds.add(menuId) : checkedMenuIds.delete(menuId);
      }
      render();
    }
    function collectFinalPkgMenuIds() {
      const { form, checkedMenuIds } = state.modal;
      const scoped = nonPlatformMenus();
      const byId = Object.fromEntries(scoped.map(x => [x.id, x]));
      const finalSet = new Set(checkedMenuIds);
      if (form.menuCheckStrictly) {
        for (const id of [...checkedMenuIds]) {
          let cur = byId[id];
          while (cur && cur.parentId !== '0' && byId[cur.parentId]) {
            finalSet.add(cur.parentId);
            cur = byId[cur.parentId];
          }
        }
      }
      return [...finalSet];
    }
    function submitPkgDrawer() {
      const { mode, form } = state.modal;
      const errors = {};
      const name = form.packageName.trim();
      if (name.length < 2 || name.length > 50) errors.packageName = '套餐名称须为 2~50 个字符';
      if (DB.packages.some(x => x.packageName === name && x.id !== form.id)) errors.packageName = '套餐名称已存在 (102002)';
      if (Object.keys(errors).length) { state.modal.errors = errors; render(); return; }

      const newMenuIds = collectFinalPkgMenuIds();
      if (mode === 'create') {
        DB.packages.push({ ...form, id: 'pkg_' + Date.now(), packageName: name, menuIds: newMenuIds, status: Number(form.status), createTime: '2026-11-24 18:20:00' });
        state.modal = null;
        showToast('success', `已新增租户套餐【${name}】`);
        render();
        return;
      }

      const oldPkg = pkgObj(form.id);
      const removedIds = oldPkg.menuIds.filter(id => !newMenuIds.includes(id));
      const boundTenants = DB.tenants.filter(t => t.packageId === oldPkg.id);
      if (removedIds.length > 0 && boundTenants.length > 0) {
        const menuMap = Object.fromEntries(ALL_MENUS.map(m => [m.id, m.title]));
        const removedNames = removedIds.map(id => menuMap[id] || id);
        openConfirm(
          '套餐权限缩减影响确认 (shrink-preview)',
          `<div class="alert-box alert-warning" style="margin-bottom:10px;"><span>本次编辑移除了 <strong>${removedIds.length}</strong> 项菜单，将同步裁剪已绑定该套餐的 <strong>${boundTenants.length}</strong> 个租户下全部角色的越界权限。</span></div>
           <p style="margin:0 0 6px;"><strong>被移除菜单：</strong>${removedNames.map(n => `<span class="tag tag-danger">${esc(n)}</span>`).join(' ')}</p>
           <p style="margin:0;"><strong>受影响租户：</strong>${boundTenants.map(t => `<span class="tag tag-info">${esc(t.tenantName)}</span>`).join(' ')}</p>`,
          () => applyPkgUpdate(oldPkg, form, name, newMenuIds, boundTenants),
          '确认缩减并裁剪权限'
        );
      } else {
        applyPkgUpdate(oldPkg, form, name, newMenuIds, boundTenants);
      }
    }
    function applyPkgUpdate(oldPkg, form, name, newMenuIds, boundTenants) {
      Object.assign(oldPkg, form, { packageName: name, menuIds: newMenuIds, status: Number(form.status) });
      const allowed = new Set(newMenuIds);
      let prunedRoles = 0;
      for (const t of boundTenants) {
        for (const role of (DB.tenantRoles[t.id] || [])) {
          const before = role.menuIds.length;
          role.menuIds = role.menuIds.filter(mid => allowed.has(mid));
          if (role.menuIds.length < before) prunedRoles++;
        }
      }
      state.modal = null;
      showToast('success', prunedRoles > 0 ? `已保存套餐【${name}】，并裁剪 ${prunedRoles} 个租户角色越界权限且刷新缓存` : `已保存租户套餐【${name}】`);
      render();
    }

    function saveTenantDrawer() {
      const { mode, isPlatformZero, form } = state.modal;
      const errors = {};
      const tName = form.tenantName.trim();
      if (tName.length < 2 || tName.length > 50) errors.tenantName = '租户名称须为 2~50 个字符';

      if (isPlatformZero) {

        const p0 = tenantObj('0');

        render(); return;
      }

      const tCode = form.tenantCode.trim();
      if (mode === 'create') {
        if (!/^[a-zA-Z0-9_-]{4,32}$/.test(tCode)) errors.tenantCode = '编码须为 4~32 位字母/数字/下划线/短横线';
        if (tCode === '000000') errors.tenantCode = '000000 为平台默认租户保留编码';
        if (DB.tenants.some(t => t.tenantCode === tCode)) errors.tenantCode = '租户编码已存在 (102002)';
        const au = form.adminUsername.trim();
        if (!/^[a-zA-Z0-9_]{2,30}$/.test(au)) errors.adminUsername = '管理员账号须为 2~30 位字母/数字/下划线';
        const pw = form.adminPassword;
        const cats = [/[A-Z]/.test(pw), /[a-z]/.test(pw), /\d/.test(pw), /[^A-Za-z0-9\s]/.test(pw)].filter(Boolean).length;
        if (pw.length < 8 || pw.length > 20 || /\s/.test(pw) || cats < 3) errors.adminPassword = '初始密码须 8~20 位无空白且至少含 3 类字符';
      }
      if (!form.packageId) errors.packageId = '请选择租户套餐';
      const accCount = form.unlimitedAccount ? -1 : Number(form.accountLimitInput);
      if (!form.unlimitedAccount && (!Number.isInteger(accCount) || accCount < 1)) errors.accountCount = '请填写 >= 1 的正整数配额（拒绝 0 歧义）';
      const expTime = form.permanentExpire ? null : form.expireInput.trim();
      if (!form.permanentExpire && !expTime) errors.expireTime = '请指定租户过期时间或勾选永久有效';

      if (Object.keys(errors).length) { state.modal.errors = errors; render(); return; }

      if (mode === 'create') {
        const newId = String(Math.floor(10005 + Math.random() * 80000));
        const pkg = pkgObj(form.packageId);
        DB.tenants.push({ id: newId, tenantCode: tCode, tenantName: tName, packageId: form.packageId, accountCount: accCount, usedUsers: 1, expireTime: expTime, status: Number(form.status), protected: false, remark: form.remark, createTime: '2026-11-24 18:22:00' });
        DB.tenantRoles[newId] = [{ roleKey: 'tenant_admin', roleName: '租户管理员', menuIds: [...(pkg?.menuIds || [])] }];
        DB.tenantAdmins[newId] = form.adminUsername.trim();
        state.modal = { type: 'tenant_init_done', tenantId: newId, tenantCode: tCode, tenantName: tName, adminUsername: form.adminUsername.trim() };
        showToast('success', `租户【${tName}】已原子初始化（顶级部门 + tenant_admin 角色 + 管理员账号）`);
        render(); return;
      }

      const oldT = tenantObj(form.id);
      let pruned = 0;
      if (oldT.packageId !== form.packageId) {
        const newAllowed = new Set(pkgObj(form.packageId)?.menuIds || []);
        for (const r of (DB.tenantRoles[oldT.id] || [])) {
          const before = r.menuIds.length;
          r.menuIds = r.menuIds.filter(id => newAllowed.has(id));
          if (r.menuIds.length < before) pruned++;
        }
      }
      Object.assign(oldT, { tenantName: tName, packageId: form.packageId, accountCount: accCount, expireTime: expTime, status: Number(form.status), remark: form.remark });
      state.modal = null;
      showToast('success', pruned > 0 ? `已保存租户并因套餐变更裁剪 ${pruned} 个角色越界权限` : `已保存租户【${tName}】`);
      render();

      document.getElementById('app').innerHTML = `
        <aside class="sidebar ${state.sidebarCollapsed ? 'collapsed' : ''}">
          <div class="brand-bar"><span class="brand-logo">S</span><span class="brand-text"><span class="brand-name">ateng-solid</span><span class="brand-sub">Admin</span></span></div>
          <div class="menu-scroll">
            <div class="menu-group-label">${isPlatformActive ? '多租户治理 (平台专属)' : '租户视图'}</div>
            ${navItems.map(m => `<button class="menu-item ${m.path === state.activeRoute ? 'active' : ''}" type="button" onclick="openRoute('${m.path}')"><span>${m.icon}</span><span class="menu-item-label">${esc(m.title)}</span></button>`).join('')}
          </div>
        </aside>
        <div class="main-column">
          <header class="topbar">
            <div class="topbar-left">
              <button class="icon-btn" type="button" onclick="state.sidebarCollapsed=!state.sidebarCollapsed; render();">☰</button>
              <nav class="breadcrumb"><span>多租户治理</span><span>/</span><span class="current">${state.activeRoute === '/system/tenant' ? '租户管理' : (state.activeRoute === '/system/tenant-package' ? '租户套餐' : '租户角色边界校验')}</span></nav>
            </div>
            <div class="topbar-right">
              ${tenantCtrl}
              <button class="icon-btn" type="button" onclick="toggleTheme()">${state.dark ? '☀' : '☾'}</button>
              <span class="user-trigger"><span class="avatar-circle">超</span><span>陈默 (super_admin)</span></span>
            </div>
          </header>
          <div class="tabs-bar">
            ${state.tabs.map(t => `<div class="tab-chip ${t.path === state.activeRoute ? 'active' : ''}" onclick="openRoute('${t.path}')"><span>${esc(t.title)}</span>${t.affix ? '' : `<button class="tab-close" type="button" onclick="event.stopPropagation(); closeTab('${t.path}')">✕</button>`}</div>`).join('')}
          </div>
          ${bannerHtml}
          <main class="workspace">${bodyHtml}</main>
        </div>
      `;

      document.getElementById('modalRoot').innerHTML = renderModal();

      document.getElementById('sim-tenant').classList.toggle('on', state.activeRoute === '/system/tenant');
      document.getElementById('sim-pkg').classList.toggle('on', state.activeRoute === '/system/tenant-package');
      document.getElementById('sim-inspect').classList.toggle('on', state.activeRoute === '/system/tenant-inspect');
      const bt = document.getElementById('sim-theme'); bt.textContent = state.dark ? 'Dark' : 'Light'; bt.classList.toggle('on', state.dark);
      const be = document.getElementById('sim-enabled'); be.textContent = state.tenantEnabled ? '多租户: 开' : '多租户: 关'; be.classList.toggle('on', state.tenantEnabled);
      const bs = document.getElementById('sim-switch'); bs.textContent = `视角: ${state.activeTenantId === '0' ? '平台(0)' : eff.tenantName}`; bs.classList.toggle('on', state.activeTenantId !== '0');

      if (activeId) {
        const el = document.getElementById(activeId);
        if (el && typeof el.focus === 'function') {
          el.focus();
          if (typeof selStart === 'number' && typeof el.setSelectionRange === 'function') {
            try { el.setSelectionRange(selStart, selEnd); } catch {}
          }
        }
      }
    }

    document.addEventListener('click', () => hidePopovers());
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        hidePopovers();
        if (document.getElementById('confirmBackdrop').classList.contains('open')) closeConfirm(false);
        else if (state.modal) { state.modal = null; render(); }
      }
    });
    render();
  </script>
</body>
</html>
