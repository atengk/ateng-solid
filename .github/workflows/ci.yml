# ==============================================================================
# 工作流：ateng-solid 聚合工作区持续集成流水线 (Workspace CI)
# 触发分支：main, dev
# ==============================================================================

name: Workspace CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-pr-title:
    name: 校验 PR 标题规范
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: 校验 PR 标题符合 Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  detect-changes:
    name: 探测变更路径
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.filter.outputs.code }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 分析改动文件类型
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!docs/**'
              - 'docs/agents/**'
              - '!.gitignore'
              - '!.editorconfig'
              - '!LICENSE'

  verify-scripts-and-contracts:
    name: 脚本静态检查与契约完整性校验
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code_changed != 'false'
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 校验工作区脚本与 Git Hooks 语法 (Bash & ShellCheck)
        run: |
          if ls scripts/*.sh >/dev/null 2>&1; then
            bash -n scripts/*.sh
            shellcheck --severity=warning scripts/*.sh
          fi
          if [ -d .githooks ]; then
            HOOK_FILES=$(grep -l '^#!' .githooks/* 2>/dev/null || true)
            if [ -n "$HOOK_FILES" ]; then
              echo "$HOOK_FILES" | xargs -r bash -n
              echo "$HOOK_FILES" | xargs -r shellcheck --severity=warning
            fi
          fi

      - name: 校验公共规约真源与同步脚本可用性
        run: |
          test -s docs/agents/contracts.md
          test -s docs/agents/foundation-first-gate.md
          test -s docs/agents/coding-standards.md
          test -s docs/agents/documentation-specification.md
          bash scripts/workspace.sh check-rules --allow-missing

  lint-workflows:
    name: 工作流规范扫描 (actionlint)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code_changed != 'false'
    timeout-minutes: 5
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 运行 actionlint 扫描工作流
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \) -print0 | xargs -0 ./actionlint -color
        shell: bash

  all-checks-passed:
    name: 质量门禁终审 (All Checks Passed)
    runs-on: ubuntu-latest
    needs: [detect-changes, validate-pr-title, verify-scripts-and-contracts, lint-workflows]
    if: always()
    timeout-minutes: 5
    steps:
      - name: 汇总校验结果
        run: |
          for res in "${{ needs.validate-pr-title.result }}" "${{ needs.detect-changes.result }}" "${{ needs.verify-scripts-and-contracts.result }}" "${{ needs.lint-workflows.result }}"; do
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "::error::Workspace CI 质量门禁检查失败！"
              exit 1
            fi
          done
          echo "✅ Workspace CI 质量门禁全部通过！"

      - name: 生成门禁看板报告
        if: always()
        run: |
          {
            echo "## 🚦 ateng-solid 工作区 CI 门禁报告"
            echo ""
            echo "| 检查项 | 状态 | 说明 |"
            echo "| :--- | :---: | :--- |"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "| **PR 标题规范** | ${{ needs.validate-pr-title.result == 'success' && '✅ 通过' || '❌ 失败' }} | Conventional Commits |"
            fi
            echo "| **路径探测** | ${{ needs.detect-changes.result == 'success' && '✅ 通过' || '❌ 异常' }} | 纯文档改动自动短路 |"
            if [ "${{ needs.detect-changes.outputs.code_changed }}" = "false" ]; then
              echo "| **脚本与工作流检查** | ⚡ 短路直通 | 仅涉及文档改动 |"
            else
              echo "| **脚本与契约校验** | ${{ needs.verify-scripts-and-contracts.result == 'success' && '✅ 通过' || '❌ 失败' }} | ShellCheck + 契约文件校验 |"
              echo "| **Workflow 语法扫描** | ${{ needs.lint-workflows.result == 'success' && '✅ 通过' || '❌ 失败' }} | actionlint 扫描 |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
