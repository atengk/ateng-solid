# ==============================================================================
# 工作流：ateng-solid 工作区自动化发版流水线 (GitHub Release)
# ==============================================================================

name: GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (必须以 v 开头，符合 SemVer 规范，如 v1.0.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate-test:
    name: 发版前置质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 静态校验脚本与 Git Hooks 语法
        run: |
          if ls scripts/*.sh >/dev/null 2>&1; then
            bash -n scripts/*.sh
            shellcheck --severity=warning scripts/*.sh
          fi
          if [ -d .githooks ]; then
            HOOK_FILES=$(grep -l '^#!' .githooks/* 2>/dev/null || true)
            if [ -n "$HOOK_FILES" ]; then
              echo "$HOOK_FILES" | xargs -r bash -n
              echo "$HOOK_FILES" | xargs -r shellcheck --severity=warning
            fi
          fi

  github-release:
    name: 自动发版与变更日志生成
    runs-on: ubuntu-latest
    needs: [gate-test]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出源码 (全量历史供日志生成)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析与校验发版版本号
        id: release-meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CURRENT_REF="${{ github.ref_name }}"
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"
            if [ "$CURRENT_REF" != "$DEFAULT_BRANCH" ]; then
              echo "::error::禁止在非默认主干分支 [$CURRENT_REF] 触发发版！请切换至 [$DEFAULT_BRANCH] 分支。"
              exit 1
            fi

            TAG_NAME="${{ inputs.version }}"
            if [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              TAG_NAME="v$TAG_NAME"
            fi
            if ! echo "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              echo "::error::版本号 [$TAG_NAME] 不符合语义化版本规范！"
              exit 1
            fi
            if git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -q "$TAG_NAME"; then
              echo "::error::远程仓库已存在相同标签 [$TAG_NAME]！"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
          else
            TAG_NAME="${{ github.ref_name }}"
            if ! echo "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              echo "::error::标签 [$TAG_NAME] 不符合语义化版本规范！"
              exit 1
            fi
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"
            git fetch origin "$DEFAULT_BRANCH"
            TAG_COMMIT=$(git rev-parse HEAD)
            if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/$DEFAULT_BRANCH"; then
              echo "::error::标签 [$TAG_NAME] 未合入主干分支 [$DEFAULT_BRANCH]，已拦截发版。"
              exit 1
            fi
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          if [[ "$TAG_NAME" =~ - ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成发布日志 (git-cliff)
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: ${{ hashFiles('.cliff.toml') != '' && '.cliff.toml' || '' }}
          args: --tag ${{ steps.release-meta.outputs.tag_name }} --latest --strip header --github-repo ${{ github.repository }}
        env:
          OUTPUT: CHANGELOG_RELEASE.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-meta.outputs.tag_name }}
          name: ${{ steps.release-meta.outputs.tag_name }}
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: ${{ steps.release-meta.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
